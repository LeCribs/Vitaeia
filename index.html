<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Recettes adaptées à tes objectifs sportifs et à ton budget, avec les produits de tes magasins.">
<title>Assiette</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--soft:#fafafa;--fill:#f2f2f2;--line:#ebebeb;--line2:#dbdbdb;
  --text:#111111;--muted:#737373;--accent:#f2542d;--accent-soft:#fff1ec;--on-accent:#ffffff;
  --p:#2f80ed;--g:#f2a516;--l:#a259ff;--ok:#1f9d55;--warn:#e5484d;
  --r-sm:10px;--r-md:14px;--r-lg:22px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;flex:none;display:block}
main{max-width:640px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin:0 -16px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.topbar .brand{font-size:26px;font-weight:800;letter-spacing:-.03em}
.topbar .brand span{color:var(--accent)}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0 0 10px;line-height:1.2}
h3{font-size:16px;font-weight:700;margin:0;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.stack>*+*{margin-top:14px}
.section{margin-top:28px}
.lead{margin:14px 0 4px}

/* Besoins */
.hero-card{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.kcal{font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.kcal small{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.band{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:16px;gap:3px}
.band span{display:block;height:100%;border-radius:99px}
.bp{background:var(--p)}.bg{background:var(--g)}.bl{background:var(--l)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.legend b{display:block;font-size:19px;font-weight:800}
.legend span{font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}
details li{margin:4px 0}
.budgetbar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:10px}
.budgetbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.budgetbar.over span{background:var(--warn)}

/* Fil des repas */
.post{margin-top:24px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.post-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.post-head b{font-size:15px}
.photo{position:relative;display:block;width:calc(100% + 32px);margin:0 -16px;border:none;padding:0;background:var(--fill);aspect-ratio:4/3;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:700;background:linear-gradient(135deg,#f6f6f6,#ececec)}
.actions{display:flex;align-items:center;gap:4px;margin:6px -8px 0}
.actions button{border:none;background:none;padding:8px;border-radius:50%;display:flex}
.actions button.on{color:var(--accent)}
.actions .grow{flex:1}
.post-body{padding:2px 0 12px;width:100%;text-align:left;border:none;background:none}
.post-body h3{font-size:16.5px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font-size:12.5px;font-weight:700;background:var(--fill);border-radius:99px;padding:3px 10px;color:#333}
.pill.hl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:#e9f7ef;color:var(--ok)}
.pill.over{background:#fdecec;color:var(--warn)}
.macros{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;color:#333}
.macros i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.total{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:22px}

/* Grille recettes */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;border:none;background:none;padding:0;font-size:12px;font-weight:700}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--line2)}
.story[aria-pressed=true] .ring{background:linear-gradient(135deg,var(--accent),#ffb03a)}
.ring>span{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;overflow:hidden;background:var(--fill)}
.ring img{width:100%;height:100%;object-fit:cover;display:block}
.ring .ini{display:flex;align-items:center;justify-content:center;height:100%;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:block;width:100%;aspect-ratio:1/1.12;border:none;padding:0;border-radius:var(--r-md);overflow:hidden;background:var(--fill);text-align:left}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.tile .ov h3{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ov p{font-size:12px;opacity:.92;margin-top:3px;font-weight:500}
.tile .tag{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.94);color:#111;border-radius:99px;padding:2px 8px}
.tile .tag.over{color:var(--warn)}
.tile .sz{display:inline-block;font-size:11px;font-weight:800;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px;margin-bottom:5px}
.pill.season{background:#e9f7ef;color:var(--ok)}
.tile .fav{position:absolute;top:6px;right:8px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

/* Formulaires */
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
input[type=number],input[type=text],input[type=search],input[type=password],textarea,select{width:100%;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#a8a8a8;background:#fff}
textarea{min-height:70px;resize:vertical}
.search{border-radius:99px !important;padding-left:16px !important;background:var(--fill) !important;border-color:transparent !important}
.seg{display:flex;background:var(--fill);border-radius:var(--r-sm);padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.opts>*+*{margin-top:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line2);border-radius:var(--r-md);padding:12px 14px}
.opt[aria-pressed=true]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.opt b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#fff}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{white-space:nowrap;flex:none}
.btn{border:none;border-radius:var(--r-sm);padding:13px 18px;font-weight:800;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--text)}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.link{background:none;border:none;color:var(--accent);font-weight:800;padding:6px 0}
.err{color:var(--warn);font-weight:700}
.steps{display:flex;gap:5px;margin:18px 0 22px}
.steps span{flex:1;height:4px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--text)}
.empty{background:var(--soft);border:1px dashed var(--line2);border-radius:var(--r-md);padding:16px;color:#444}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:16px}
.x{border:none;background:var(--fill);border-radius:50%;width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}

/* Magasins */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.store{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--line2);background:#fff;border-radius:var(--r-md);padding:14px 6px 10px;font-weight:700;font-size:13.5px}
.store[aria-pressed=true]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.store .chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;display:none;align-items:center;justify-content:center}
.store[aria-pressed=true] .chk{display:flex}
.logo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);overflow:hidden;flex:none}
.logo img{width:78%;height:78%;object-fit:contain}
.logo.sm{width:22px;height:22px;border-radius:6px}
.logo.md{width:34px;height:34px;border-radius:9px}
.sb{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--sb);color:#111;font-weight:800;font-size:13px;letter-spacing:.02em}
.logo.sm .sb{font-size:8px}.logo.md .sb{font-size:10px}
.storehead{display:flex;align-items:center;gap:10px}
.spill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:var(--fill);border-radius:99px;padding:2px 9px 2px 3px}

/* Produits */
.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.prow{display:flex;gap:12px;align-items:center}
.pimg{width:60px;height:60px;border-radius:var(--r-sm);object-fit:contain;background:var(--soft);border:1px solid var(--line);flex:none}
.pimg.none{display:flex;align-items:center;justify-content:center;color:#bbb}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1}
.list>*+*{margin-top:10px}
.price{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.price .pt{flex:1;min-width:0}
.price b{font-size:16px}
.price.mine{background:linear-gradient(90deg,var(--accent-soft),transparent);margin:0 -10px;padding:10px;border-radius:var(--r-sm)}

/* Courses */
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 0}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.check[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed=true] .ct{text-decoration:line-through;color:var(--muted)}
.check .ct{flex:1}
.check .q{text-align:right;white-space:nowrap}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs[hidden]{display:none}
nav.tabs button{flex:1;max-width:120px;border:none;background:none;padding:6px 2px;color:#8a8a8a;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current=page]{color:var(--text)}
nav.tabs svg.i{width:25px;height:25px}

/* Fiches */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet[hidden]{display:none}
.sheet-in{background:#fff;width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet-pad{padding-top:18px}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero{position:relative;margin:0 -18px;aspect-ratio:16/10;background:var(--fill);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .x{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.credit{font-size:11.5px;color:var(--muted);margin-top:6px}
.credit a{color:var(--muted)}
.photo-actions{display:flex;flex-wrap:wrap;gap:0 16px}
.stepper{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-top:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:#fff;font-size:20px;font-weight:700}
.stepper div{flex:1}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing li .n{flex:1}
.ing li .q{white-space:nowrap;text-align:right}
.ing .link{padding:0;font-size:13.5px}
ol.how{padding-left:22px;margin:0}
ol.how li{margin:8px 0}
.video{position:relative;border-radius:var(--r-md);overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:14px}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;font-weight:700;padding:10px 16px;border-radius:99px;z-index:30;max-width:90%;text-align:center;font-size:14px}
.toast[hidden]{display:none}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="photocam" accept="image/*" capture="environment" hidden>
<input type="file" id="photogal" accept="image/*" hidden>

{id:"gratin-dauphinois",n:"Gratin dauphinois et salade verte",t:"ds",k:"E",m:75,i:[["pdt",300],["lait",120],["creme",30],["emmental",15],["salade",80]],e:["Coupe les pommes de terre en fines rondelles, frotte le plat avec de l’ail.","Couvre de lait et de crème salés, poivrés et muscadés, parsème d’emmental.","Cuis 1 h à 170 °C, sers avec la salade."],q:"gratin dauphinois"},
{id:"ratatouille-riz",n:"Ratatouille et riz",t:"ds",k:"L",m:45,i:[["courgette",120],["aubergine",120],["poivron",80],["tomate",120],["oignon",40],["huile",10],["riz",150]],e:["Fais revenir l’oignon dans l’huile, ajoute aubergine et poivron 8 min.","Ajoute courgette, tomates, ail et herbes de Provence, mijote 25 min.","Sers avec le riz."],q:"ratatouille"},
{id:"poelee-automnale",n:"Poêlée automnale et saucisses de volaille",t:"ds",k:"E",m:35,i:[["potiron",200],["champi",100],["saucisse",120],["oignon",30],["huile",5],["pdt",150]],e:["Dore les saucisses 10 min, réserve.","Poêle potiron en dés, pommes de terre et oignon 15 min à couvert, puis les champignons 5 min.","Remets les saucisses et assaisonne de thym."],q:"squash mushrooms sausage skillet"},
{id:"pot-au-feu",n:"Pot-au-feu",t:"ds",k:"E",m:170,i:[["paleron",150],["carotte",120],["poireau",100],["pdt",200],["chou",80]],e:["Couvre la viande d’eau froide avec un oignon piqué de clous de girofle et un bouquet garni, mijote 2 h en écumant.","Ajoute carottes, poireaux, chou et pommes de terre pour 40 min.","Sers avec un peu de bouillon, de la moutarde et du gros sel."],q:"pot au feu"},
{id:"croque-monsieur",n:"Croque-monsieur et salade",t:"ds",k:"E",m:15,i:[["pain",80],["jambon",60],["emmental",25],["salade",60],["tomate",60]],e:["Garnis le pain de jambon et d’emmental.","Dore 4 min par face à la poêle ou 8 min au four.","Sers avec la salade et la tomate."],q:"croque monsieur salad"},
{id:"galette-complete",n:"Galette de sarrasin complète",t:"ds",k:"E",m:15,i:[["sarrasin",60],["oeuf",50],["jambon",50],["emmental",25],["salade",50],["beurre",5]],e:["Mélange la farine de sarrasin avec 12 cl d’eau et une pincée de sel.","Cuis la galette dans le beurre, casse l’œuf au centre, ajoute jambon et emmental.","Replie les bords et sers avec la salade."],q:"galette complete buckwheat"},
{id:"steak-hache-puree",n:"Steak haché, purée maison et salade",t:"ds",k:"S",m:30,i:[["boeuf5",150],["pdt",250],["lait",50],["beurre",5],["salade",50]],e:["Cuis les pommes de terre 20 min, écrase-les avec le lait et le beurre.","Cuis le steak 2 à 3 min par face.","Sers avec la purée et la salade."],q:"steak mashed potatoes salad"},
{id:"cabillaud-puree-celeri",n:"Cabillaud et purée de céleri",t:"ds",k:"L",m:30,i:[["cabillaud",180],["celeri",200],["pdt",100],["lait",50],["beurre",5],["epinards",80]],e:["Cuis céleri et pomme de terre en morceaux 20 min, mixe avec le lait et le beurre.","Cuis le cabillaud 4 min par face.","Fais tomber les épinards 2 min."],q:"cod celeriac puree"},
{id:"endives-jambon",n:"Endives au jambon gratinées",t:"ds",k:"E",m:45,i:[["endive",250],["jambon",80],["lait",150],["farine",10],["beurre",8],["emmental",20]],e:["Cuis les endives 15 min à la vapeur et égoutte-les bien.","Prépare une béchamel : beurre et farine 1 min, puis le lait en fouettant jusqu’à épaississement.","Roule les endives dans le jambon, nappe de béchamel et d’emmental, 20 min à 200 °C."],q:"endives ham gratin"},
{id:"tomates-farcies",n:"Tomates farcies",t:"ds",k:"E",m:55,i:[["tomate",300],["boeuf5",120],["oignon",30],["pain",15],["riz",150]],e:["Évide les tomates.","Mélange bœuf, oignon haché, mie de pain trempée, persil, sel et poivre, puis farcis les tomates.","Cuis 40 min à 180 °C, sers avec le riz."],q:"stuffed tomatoes"},
{id:"petit-sale-lentilles",n:"Petit salé aux lentilles",t:"ds",k:"S",m:75,i:[["petitsale",120],["lentilles",220],["carotte",80],["oignon",30]],e:["Dessale la viande 1 h dans l’eau froide si besoin.","Mijote-la 1 h avec carotte, oignon et un bouquet garni.","Ajoute les lentilles cuites 10 min avant la fin."],q:"pork lentils stew"},

/* ---- Cuisines du monde ---- */

{id:"chili-sin-carne",n:"Chili sin carne",t:"ds",k:"E",m:30,i:[["hrouges",200],["mais",60],["tconc",150],["poivron",80],["oignon",40],["riz",150]],e:["Fais revenir oignon et poivron avec cumin et paprika.","Ajoute tomates, haricots et maïs, mijote 15 min.","Sers avec le riz."],q:"vegetarian chili beans"},
{id:"curry-pois-chiches",n:"Curry de pois chiches au lait de coco",t:"ds",k:"E",m:30,i:[["pchiches",200],["laitcoco",80],["epinards",80],["tconc",100],["oignon",40],["riz",150]],e:["Fais revenir l’oignon avec 1 c. à café de curry.","Ajoute tomates, lait de coco et pois chiches, mijote 15 min.","Incorpore les épinards, sers avec le riz."],q:"chickpea coconut curry"},
{id:"dahl-lentilles",n:"Dahl de lentilles corail",t:"ds",k:"E",m:30,i:[["lcorail",220],["laitcoco",50],["tconc",100],["oignon",40],["riz",120]],e:["Fais revenir l’oignon avec curry, cumin et curcuma.","Ajoute lentilles, tomates et lait de coco, mijote 15 min.","Sers avec le riz."],q:"red lentil dal rice"},
{id:"poulet-tikka",n:"Poulet tikka masala et riz basmati",t:"ds",k:"S",m:35,i:[["poulet",150],["yaourt",60],["tconc",120],["creme",20],["oignon",40],["riz",180]],e:["Fais mariner le poulet en dés dans le yaourt et les épices tikka, au moins 15 min.","Saisis-le 5 min, ajoute l’oignon puis les tomates, mijote 15 min et termine par la crème.","Sers avec le riz basmati."],q:"chicken tikka masala rice"},
{id:"pad-thai-crevettes",n:"Pad thaï aux crevettes",t:"ds",k:"E",m:25,i:[["nouilles",200],["crevettes",120],["oeuf",50],["carotte",60],["cacahuetes",15],["soja",15],["huile",10]],e:["Fais tremper les nouilles selon le paquet.","Saisis crevettes et carotte en julienne 3 min, pousse sur le côté et brouille l’œuf.","Ajoute nouilles, sauce soja et citron vert, parsème de cacahuètes concassées."],q:"pad thai shrimp"},
{id:"bowl-teriyaki",n:"Bowl poulet teriyaki",t:"ds",k:"S",m:25,i:[["poulet",150],["riz",180],["brocoli",100],["carotte",60],["soja",15],["miel",10],["huile",5]],e:["Poêle le poulet en dés 6 min.","Ajoute sauce soja et miel, laisse caraméliser 2 min.","Sers sur le riz avec brocolis vapeur et carotte râpée."],q:"teriyaki chicken bowl"},
{id:"poke-saumon",n:"Poke bowl au saumon",t:"d",k:"S",m:20,i:[["saumon",120],["riz",180],["avocat",60],["concombre",60],["soja",10]],e:["Coupe le saumon très frais en dés et fais-le mariner 10 min dans la sauce soja.","Dispose sur le riz avec l’avocat et le concombre, parsème de sésame."],q:"salmon poke bowl"},
{id:"bibimbap-boeuf",n:"Bibimbap au bœuf",t:"ds",k:"S",m:30,i:[["rumsteck",120],["riz",180],["oeuf",50],["epinards",60],["carotte",60],["soja",10],["huile",5]],e:["Saisis le bœuf en fines lanières avec la sauce soja 2 min.","Fais sauter carottes et épinards séparément, cuis l’œuf au plat.","Dispose le tout sur le riz, avec du piment coréen si tu aimes."],q:"bibimbap beef"},
{id:"couscous-poulet",n:"Couscous de poulet aux légumes",t:"ds",k:"E",m:35,i:[["poulet",150],["semoule",200],["courgette",100],["carotte",80],["pchiches",60],["huile",5]],e:["Dore le poulet avec du ras-el-hanout.","Ajoute légumes, pois chiches et 30 cl d’eau, mijote 20 min.","Sers sur la semoule."],q:"chicken couscous vegetables"},
{id:"tajine-poulet",n:"Tajine de poulet aux légumes",t:"ds",k:"L",m:45,i:[["poulet",140],["carotte",100],["courgette",100],["pchiches",60],["oignon",40],["semoule",100],["huile",5]],e:["Dore le poulet avec oignon, gingembre et cumin.","Ajoute carottes, courgettes, pois chiches et 20 cl d’eau, mijote 30 min à couvert.","Sers avec la semoule et un peu de coriandre."],q:"chicken tagine vegetables"},
{id:"fajitas-poulet",n:"Fajitas de poulet aux poivrons",t:"ds",k:"S",m:25,i:[["tortilla",120],["poulet",140],["poivron",120],["oignon",50],["huile",5],["yaourt",40]],e:["Saisis le poulet en lanières avec les épices à fajitas, 5 min.","Ajoute poivrons et oignon émincés, 5 min.","Garnis les tortillas, avec une cuillère de yaourt."],q:"chicken fajitas peppers"},
{id:"bowl-burrito",n:"Bowl burrito aux haricots noirs",t:"ds",k:"E",m:15,i:[["hnoirs",150],["riz",150],["mais",60],["tomate",80],["avocat",50],["salade",30]],e:["Réchauffe les haricots avec cumin et paprika.","Dispose riz, haricots, maïs, tomates, avocat et salade.","Ajoute du citron vert et de la sauce piquante."],q:"burrito bowl black beans"},
{id:"moussaka",n:"Moussaka allégée",t:"ds",k:"L",m:70,i:[["aubergine",250],["boeuf5",100],["tconc",100],["oignon",30],["lait",80],["farine",8],["emmental",15],["huile",5]],e:["Rôtis les aubergines en tranches 20 min à 200 °C.","Fais revenir oignon et bœuf, ajoute tomates et cannelle, 10 min.","Alterne aubergines et viande, nappe d’une béchamel légère et d’emmental, 30 min à 180 °C."],q:"moussaka"},
{id:"paella",n:"Paella au poulet et fruits de mer",t:"ds",k:"S",m:40,i:[["riz",180],["poulet",100],["crevettes",60],["moules",60],["poivron",60],["ppois",40],["tconc",50],["huile",10]],e:["Dore le poulet dans l’huile, ajoute poivron, tomates et une pincée de safran.","Ajoute le riz cuit et un peu de bouillon, mélange 5 min.","Incorpore crevettes, moules et petits pois, réchauffe 5 min."],q:"paella seafood chicken"},
{id:"risotto-champignons",n:"Risotto aux champignons",t:"ds",k:"E",m:35,i:[["rizrond",200],["champi",150],["oignon",30],["parmesan",15],["beurre",5],["huile",5]],e:["Fais revenir l’oignon, puis nacre le riz (cru) 2 min.","Mouille de bouillon chaud louche par louche pendant 18 min en remuant, ajoute les champignons poêlés à mi-cuisson.","Hors du feu, ajoute parmesan et beurre."],q:"mushroom risotto"},
{id:"gnocchis-tomate-mozza",n:"Gnocchis à la tomate et mozzarella",t:"ds",k:"E",m:20,i:[["gnocchis",250],["tconc",150],["mozza",60],["huile",5]],e:["Poêle les gnocchis 5 min dans l’huile.","Ajoute la sauce tomate et le basilic, 5 min.","Parsème de mozzarella et gratine 5 min au four."],q:"gnocchi tomato mozzarella"},
{id:"wok-boeuf-legumes",n:"Wok de bœuf aux légumes",t:"ds",k:"S",m:25,i:[["rumsteck",140],["nouilles",180],["brocoli",100],["carotte",60],["poivron",60],["soja",15],["huile",10]],e:["Saisis le bœuf en lanières 2 min à feu vif, réserve.","Fais sauter les légumes 5 min, ajoute nouilles, bœuf et sauce soja."],q:"beef stir fry vegetables"},
{id:"riz-cantonais",n:"Riz cantonais",t:"ds",k:"E",m:20,i:[["riz",200],["oeuf",100],["jambon",60],["ppois",70],["huile",10],["soja",10]],e:["Brouille les œufs dans l’huile, réserve.","Fais sauter riz, petits pois et jambon 5 min.","Remets les œufs et ajoute la sauce soja."],q:"egg fried rice"},
{id:"falafels-houmous",n:"Falafels maison, houmous et taboulé",t:"ds",k:"E",m:35,i:[["pchiches",150],["oignon",30],["farine",10],["huile",15],["houmous",50],["boulgour",100],["tomate",60],["persil",20]],e:["Mixe pois chiches, oignon, ail, cumin, coriandre et farine, forme 6 galettes.","Dore-les 4 min par face dans l’huile.","Sers avec le houmous et un taboulé de boulgour, tomates et persil."],q:"falafel hummus tabbouleh"},

/* ---- Pâtes, riz et céréales ---- */
{id:"pates-bolognaise",n:"Pâtes complètes bolognaise",t:"ds",k:"S",m:30,i:[["patesc",220],["boeuf5",130],["tconc",150],["oignon",50],["huile",5],["parmesan",10]],e:["Fais revenir l’oignon, puis le bœuf 5 min.","Ajoute les tomates, mijote 15 min.","Sers sur les pâtes, parsème de parmesan."],q:"spaghetti bolognese"},
{id:"pates-pesto-poulet",n:"Pâtes au pesto, poulet et tomates cerises",t:"ds",k:"S",m:20,i:[["pates",220],["poulet",130],["pesto",25],["tomate",80]],e:["Poêle le poulet en dés 7 min.","Mélange pâtes chaudes, pesto, poulet et tomates cerises coupées en deux."],q:"pesto pasta chicken"},
{id:"pates-saumon",n:"Pâtes au saumon et épinards",t:"ds",k:"S",m:25,i:[["pates",220],["saumon",100],["creme",40],["epinards",60]],e:["Poêle le saumon en dés 4 min.","Ajoute épinards et crème, 2 min.","Mélange aux pâtes."],q:"salmon spinach pasta"},
{id:"lasagnes-legumes",n:"Lasagnes aux légumes",t:"ds",k:"E",m:60,i:[["pates",120],["courgette",120],["aubergine",80],["tconc",120],["ricotta",60],["mozza",30],["epinards",50]],e:["Poêle courgettes et aubergines en dés 8 min.","Alterne feuilles de lasagne, sauce tomate, légumes, épinards et ricotta.","Termine par la mozzarella, 35 min à 180 °C."],q:"vegetable lasagna"},
{id:"pates-courge-sauge",n:"Pâtes à la courge rôtie et sauge",t:"ds",k:"L",m:35,i:[["pates",200],["potiron",200],["parmesan",10],["huile",10],["noisettes",10]],e:["Rôtis la courge en dés 25 min à 200 °C avec l’huile.","Mélange aux pâtes avec quelques feuilles de sauge poêlées.","Parsème de parmesan et de noisettes concassées."],q:"butternut squash pasta sage"},
{id:"one-pot-pasta",n:"One pot pasta tomate-basilic",t:"ds",k:"L",m:20,i:[["pates",200],["tomate",150],["oignon",30],["huile",5],["parmesan",10],["epinards",40]],e:["Mets les pâtes crues, les tomates cerises, l’oignon émincé, l’ail et le basilic dans une sauteuse, couvre d’eau.","Cuis 12 min en remuant jusqu’à absorption, ajoute les épinards.","Sers avec le parmesan."],q:"one pot pasta tomato basil"},
{id:"carbonara",n:"Carbonara allégée",t:"ds",k:"E",m:20,i:[["pates",220],["lardons",35],["oeuf",50],["parmesan",12]],e:["Fais dorer les lardons sans matière grasse.","Bats l’œuf avec le parmesan et du poivre.","Hors du feu, mélange les pâtes chaudes avec les lardons puis l’œuf, avec un peu d’eau de cuisson."],q:"spaghetti carbonara"},
{id:"risotto-orge-poireaux",n:"Risotto d’orge perlé aux poireaux",t:"ds",k:"E",m:30,i:[["orge",200],["poireau",150],["parmesan",15],["huile",5],["creme",15]],e:["Fais fondre les poireaux émincés 8 min dans l’huile.","Ajoute l’orge cuit et un peu de bouillon, 8 min.","Termine avec la crème et le parmesan."],q:"pearl barley risotto leeks"},
{id:"risotto-asperges",n:"Risotto aux asperges et petits pois",t:"ds",k:"E",m:35,i:[["rizrond",200],["asperges",150],["ppoisfr",60],["parmesan",15],["oignon",30],["huile",5]],e:["Fais revenir l’oignon, puis nacre le riz (cru) 2 min.","Mouille de bouillon chaud louche par louche pendant 18 min, ajoute les asperges en tronçons et les petits pois à mi-cuisson.","Hors du feu, ajoute le parmesan."],q:"asparagus risotto peas"},
{id:"boulgour-legumes-feta",n:"Boulgour aux légumes rôtis et feta",t:"ds",k:"L",m:35,i:[["boulgour",180],["courgette",100],["poivron",80],["oignon",30],["feta",40],["huile",10]],e:["Rôtis les légumes en dés 25 min à 200 °C avec l’huile.","Mélange au boulgour cuit, ajoute la feta émiettée et de la menthe."],q:"bulgur roasted vegetables feta"},

/* ---- Végétarien et vegan ---- */
{id:"buddha-bowl-tofu",n:"Buddha bowl au tofu",t:"ds",k:"E",m:25,i:[["tofu",150],["quinoa",150],["avocat",60],["carotte",60],["epinards",40],["soja",10],["huile",5]],e:["Dore le tofu en cubes 8 min, déglace à la sauce soja.","Dispose quinoa, pousses d’épinards, carotte râpée, avocat et tofu."],q:"tofu buddha bowl"},
{id:"curry-patate-douce",n:"Curry de patate douce et épinards",t:"ds",k:"L",m:35,i:[["pdouce",200],["epinards",80],["laitcoco",60],["tconc",80],["oignon",30],["riz",120]],e:["Fais revenir l’oignon avec curry et gingembre.","Ajoute la patate douce en dés, les tomates et le lait de coco, mijote 20 min.","Incorpore les épinards, sers avec le riz."],q:"sweet potato spinach curry"},
{id:"gratin-courgettes-chevre",n:"Gratin de courgettes au chèvre",t:"ds",k:"L",m:35,i:[["courgette",300],["chevre",40],["oeuf",50],["lait",50],["pain",40]],e:["Poêle les courgettes en rondelles 8 min.","Mets-les dans un plat, verse l’œuf battu avec le lait, ajoute le chèvre en rondelles.","Cuis 20 min à 200 °C, sers avec le pain."],q:"zucchini goat cheese gratin"},
{id:"galettes-legumes",n:"Galettes de légumes et sauce yaourt",t:"ds",k:"L",m:25,i:[["pdouce",120],["carotte",80],["oeuf",50],["farine",20],["huile",10],["yaourt",80]],e:["Râpe patate douce et carotte, mélange avec l’œuf, la farine, le cumin et du sel.","Forme 4 galettes et dore-les 4 min par face dans l’huile.","Sers avec le yaourt citronné et de la menthe."],q:"vegetable fritters yogurt sauce"},
{id:"choufleur-roti",n:"Chou-fleur rôti au curcuma et pois chiches",t:"ds",k:"L",m:40,i:[["choufleur",300],["pchiches",120],["huile",10],["quinoa",100]],e:["Mélange le chou-fleur en fleurettes et les pois chiches avec l’huile, le curcuma et le cumin.","Rôtis 30 min à 200 °C.","Sers sur le quinoa avec un filet de citron."],q:"roasted cauliflower chickpeas turmeric"},
{id:"tarte-legumes-soleil",n:"Tarte fine aux légumes du soleil",t:"ds",k:"L",m:45,i:[["pate",50],["courgette",100],["tomate",100],["aubergine",60],["chevre",25],["huile",5]],e:["Étale la pâte sur une plaque.","Dispose les légumes en fines rondelles et le chèvre, arrose d’huile et d’herbes.","Cuis 30 min à 200 °C. Une part = 1/4 de tarte."],q:"vegetable tart summer"},
{id:"omelette-champignons",n:"Omelette aux champignons et salade",t:"ds",k:"L",m:15,i:[["oeuf",150],["blanc",100],["champi",120],["salade",80],["huile",5]],e:["Poêle les champignons 5 min.","Verse œufs et blancs battus, cuis 3 min.","Sers avec la salade."],q:"mushroom omelette salad"},
{id:"aubergines-farcies",n:"Aubergines farcies au boulgour",t:"ds",k:"L",m:50,i:[["aubergine",300],["boulgour",100],["tomate",100],["oignon",30],["pchiches",60],["huile",10]],e:["Coupe les aubergines en deux, évide-les et rôtis-les 20 min à 200 °C.","Poêle la chair hachée avec oignon, tomates et pois chiches, ajoute le boulgour cuit.","Farcis et enfourne 15 min."],q:"stuffed eggplant bulgur"},
{id:"poelee-oeufs",n:"Poêlée de légumes et œufs au plat",t:"ds",k:"L",m:20,i:[["courgette",100],["poivron",80],["champi",80],["oignon",30],["oeuf",100],["huile",10],["pain",50]],e:["Poêle les légumes émincés 10 min dans l’huile.","Creuse deux puits, casse les œufs et couvre 4 min.","Sers avec le pain."],q:"vegetable skillet fried eggs"},
{id:"steaks-lentilles",n:"Steaks de lentilles maison et légumes",t:"ds",k:"E",m:30,i:[["lentilles",200],["avoine",30],["oignon",30],["carotte",50],["huile",10],["salade",60],["tomate",80]],e:["Mixe grossièrement lentilles, flocons, oignon, carotte râpée et épices.","Forme 3 steaks et dore-les 4 min par face.","Sers avec la salade et les tomates."],q:"lentil patties salad"},
{id:"potiron-farci",n:"Potiron farci au quinoa",t:"ds",k:"L",m:55,i:[["potiron",300],["quinoa",150],["champi",60],["noisettes",15],["oignon",30],["huile",5]],e:["Coupe un petit potiron en deux, épépine-le et rôtis-le 35 min à 190 °C.","Poêle oignon et champignons, mélange au quinoa et aux noisettes.","Farcis le potiron et remets 10 min au four."],q:"stuffed pumpkin quinoa"},
{id:"tortilla-espagnole",n:"Tortilla espagnole",t:"ds",k:"E",m:30,i:[["oeuf",200],["pdt",200],["oignon",50],["huile",10],["salade",50]],e:["Cuis pommes de terre et oignon en fines tranches 12 min à couvert.","Verse les œufs battus, cuis 8 min à feu doux, retourne 2 min.","Sers avec la salade."],q:"spanish tortilla"},
{id:"pizza-legumes",n:"Pizza maison aux légumes",t:"ds",k:"E",m:30,i:[["patepizza",120],["tconc",60],["mozza",50],["poivron",50],["champi",50],["courgette",50]],e:["Étale la pâte et nappe de tomate.","Ajoute les légumes émincés et la mozzarella.","Cuis 15 min à 230 °C."],q:"vegetable pizza homemade"},
{id:"tofu-nouilles",n:"Tofu sauté aux nouilles et brocolis",t:"ds",k:"E",m:20,i:[["tofu",180],["nouilles",180],["brocoli",100],["soja",15],["huile",10]],e:["Dore le tofu en cubes 8 min.","Ajoute les brocolis 4 min, puis les nouilles et la sauce soja."],q:"tofu noodles broccoli"},

/* ---- Viandes et poissons ---- */
{id:"poulet-riz-brocolis",n:"Poulet, riz basmati et brocolis",t:"ds",k:"S",m:25,i:[["poulet",150],["riz",200],["brocoli",200],["huile",10]],e:["Cuis le riz et les brocolis à la vapeur.","Poêle le poulet en morceaux 8 min dans l’huile, sale et poivre.","Assemble."],q:"chicken rice broccoli"},
{id:"saumon-patate-douce",n:"Saumon, patate douce et haricots verts",t:"ds",k:"S",m:30,i:[["saumon",150],["pdouce",250],["hverts",150],["huile",5]],e:["Rôtis la patate douce en cubes 25 min à 200 °C.","Cuis le saumon 12 min au four en même temps.","Cuis les haricots verts 8 min à la vapeur."],q:"salmon sweet potato green beans"},
{id:"cabillaud-papillote",n:"Cabillaud en papillote, quinoa et courgettes",t:"ds",k:"L",m:30,i:[["cabillaud",180],["quinoa",180],["courgette",150],["tomate",80],["huile",10]],e:["Dispose cabillaud, courgette et tomate en papillote avec l’huile et du citron.","Cuis 18 min à 200 °C.","Sers avec le quinoa."],q:"baked cod zucchini"},
{id:"dinde-champignons",n:"Dinde à la crème de champignons et pâtes",t:"ds",k:"E",m:25,i:[["dinde",150],["champi",120],["creme",40],["pates",200]],e:["Dore la dinde en lanières 5 min.","Ajoute les champignons 5 min, puis la crème.","Sers avec les pâtes."],q:"creamy mushroom turkey pasta"},
{id:"poulet-basquaise",n:"Poulet basquaise",t:"ds",k:"E",m:35,i:[["poulet",150],["poivron",120],["tconc",100],["oignon",40],["riz",170],["huile",5]],e:["Dore le poulet, ajoute oignon et poivrons 5 min.","Ajoute les tomates, mijote 20 min.","Sers avec le riz."],q:"chicken peppers tomato stew"},
{id:"papillote-poireaux",n:"Papillote de poisson blanc aux poireaux",t:"ds",k:"L",m:35,i:[["cabillaud",170],["poireau",200],["creme",20],["pdt",200]],e:["Fais fondre les poireaux émincés 8 min.","Mets-les en papillote avec le poisson, la crème et du citron, 18 min à 200 °C.","Sers avec les pommes de terre vapeur."],q:"fish papillote leeks"},
{id:"brochettes-poulet",n:"Brochettes de poulet au citron et légumes grillés",t:"ds",k:"S",m:35,i:[["poulet",150],["courgette",100],["poivron",100],["oignon",40],["huile",10],["semoule",120]],e:["Fais mariner le poulet en cubes avec citron, huile et herbes 15 min.","Alterne poulet et légumes sur des brochettes, grille 12 min en retournant.","Sers avec la semoule."],q:"chicken skewers grilled vegetables"},
{id:"escalope-dinde-legumes",n:"Escalope de dinde et poêlée de légumes",t:"ds",k:"L",m:20,i:[["dinde",140],["courgette",120],["carotte",80],["brocoli",100],["huile",10]],e:["Poêle l’escalope 4 min par face.","Fais sauter les légumes en dés 10 min avec ail et herbes."],q:"turkey escalope vegetables"},
{id:"truite-asperges",n:"Truite aux amandes, asperges et pommes de terre nouvelles",t:"ds",k:"L",m:30,i:[["truite",150],["asperges",150],["pdt",200],["amandes",10],["beurre",5]],e:["Cuis les pommes de terre nouvelles 15 min et les asperges 8 min à la vapeur.","Poêle la truite 3 min par face dans le beurre, ajoute les amandes effilées 1 min."],q:"trout almonds asparagus"},
{id:"crevettes-ail-riz",n:"Crevettes sautées à l’ail, riz et petits pois",t:"ds",k:"E",m:20,i:[["crevettes",150],["riz",180],["poivron",80],["ppois",80],["soja",10],["huile",10]],e:["Poêle poivron, ail et petits pois 5 min.","Ajoute riz et crevettes, puis la sauce soja, 3 min à feu vif."],q:"garlic shrimp rice peas"},
{id:"boeuf-saute-poivrons",n:"Bœuf sauté aux poivrons et riz",t:"ds",k:"S",m:20,i:[["rumsteck",150],["poivron",120],["oignon",40],["riz",180],["soja",10],["huile",10]],e:["Saisis le bœuf en lanières 2 min à feu très vif, réserve.","Poêle poivron et oignon 5 min, remets le bœuf et la sauce soja.","Sers avec le riz."],q:"beef stir fry peppers"},
{id:"sardines-grillees",n:"Sardines grillées, pommes de terre et salade",t:"ds",k:"E",m:25,i:[["sardfr",180],["pdt",250],["salade",60],["tomate",80],["huile",5]],e:["Cuis les pommes de terre à l’eau 15 min.","Grille les sardines 3 min par face, avec du gros sel.","Sers avec les pommes de terre, la salade et les tomates."],q:"grilled sardines potatoes salad"},

/* ---- Salades complètes ---- */
{id:"salade-cesar",n:"Salade César allégée",t:"d",k:"S",m:20,i:[["poulet",150],["salade",100],["parmesan",15],["pain",30],["ygrec",40],["tomate",60]],e:["Grille le poulet et le pain en croûtons.","Prépare la sauce : yaourt grec, citron, moutarde et un peu de parmesan.","Mélange le tout."],q:"chicken caesar salad"},
{id:"salade-nicoise",n:"Salade niçoise",t:"ds",k:"E",m:25,i:[["thon",80],["oeuf",50],["hverts",80],["tomate",100],["pdt",120],["olives",15],["salade",50],["huile",10]],e:["Cuis l’œuf 9 min, les pommes de terre 15 min et les haricots verts 8 min.","Dispose salade, tomates, pommes de terre, haricots, thon, œuf et olives.","Assaisonne d’huile et de vinaigre."],q:"nicoise salad"},
{id:"salade-lentilles-oeufs",n:"Salade de lentilles, œufs et légumes",t:"ds",k:"E",m:15,i:[["lentilles",200],["oeuf",100],["tomate",100],["concombre",80],["huile",10]],e:["Cuis les œufs 9 min et écale-les.","Mélange lentilles, légumes en dés, huile, vinaigre et moutarde.","Ajoute les œufs en quartiers."],q:"lentil salad boiled eggs"},
{id:"salade-quinoa-feta",n:"Salade de quinoa, feta et pois chiches",t:"ds",k:"E",m:15,i:[["quinoa",150],["pchiches",100],["feta",40],["concombre",80],["tomate",80],["huile",10]],e:["Mélange le quinoa froid, les pois chiches et les légumes en dés.","Ajoute la feta, l’huile, le citron et la menthe."],q:"quinoa salad feta chickpeas"},
{id:"taboule-libanais",n:"Taboulé libanais",t:"ds",k:"L",m:20,i:[["persil",60],["boulgour",60],["tomate",150],["concombre",80],["oignon",20],["huile",10],["pita",50]],e:["Hache finement le persil et la menthe.","Ajoute le boulgour cuit, les tomates et le concombre en petits dés, et l’oignon.","Assaisonne de citron, d’huile et de sel, laisse 15 min au frais et sers avec la pita."],q:"lebanese tabbouleh"},
{id:"salade-pates-thon",n:"Salade de pâtes au thon",t:"ds",k:"E",m:15,i:[["pates",200],["thon",100],["tomate",80],["mais",50],["huile",10]],e:["Laisse refroidir les pâtes cuites.","Ajoute le thon émietté, les tomates, le maïs, l’huile et le vinaigre."],q:"tuna pasta salad"},
{id:"salade-riz-poulet",n:"Salade de riz au poulet et maïs",t:"ds",k:"S",m:20,i:[["riz",180],["poulet",120],["mais",60],["tomate",80],["poivron",50],["huile",10]],e:["Poêle le poulet en dés 7 min et laisse tiédir.","Mélange avec le riz froid, le maïs, les tomates et le poivron.","Assaisonne d’huile, de vinaigre et de moutarde."],q:"chicken rice salad corn"},
{id:"salade-chevre-chaud",n:"Salade de chèvre chaud, noix et pomme",t:"ds",k:"E",m:15,i:[["chevre",50],["pain",40],["salade",80],["pomme",100],["noix",15],["miel",5],["huile",5]],e:["Pose le chèvre sur les tranches de pain, ajoute un filet de miel et gratine 5 min.","Dispose sur la salade avec la pomme en lamelles et les noix.","Assaisonne d’une vinaigrette."],q:"warm goat cheese salad walnuts apple"},
{id:"salade-betterave-lentilles",n:"Salade de betterave, lentilles et feta",t:"ds",k:"L",m:10,i:[["betterave",150],["lentilles",150],["feta",30],["salade",40],["noix",10],["huile",5]],e:["Coupe la betterave en dés.","Mélange avec les lentilles, la salade, la feta émiettée et les noix.","Assaisonne d’huile et de vinaigre balsamique."],q:"beetroot lentil salad feta"},
{id:"salade-patate-douce",n:"Salade de patate douce rôtie et pois chiches",t:"ds",k:"L",m:30,i:[["pdouce",200],["pchiches",120],["epinards",40],["huile",10]],e:["Rôtis la patate douce en dés 25 min à 200 °C avec l’huile et le paprika.","Mélange avec les pois chiches et les pousses d’épinards.","Assaisonne de citron et de cumin."],q:"roasted sweet potato chickpea salad"},
{id:"salade-printaniere",n:"Salade printanière : radis, petits pois et œuf mollet",t:"ds",k:"L",m:15,i:[["radis",80],["ppoisfr",100],["oeuf",100],["salade",60],["feta",25],["huile",10]],e:["Cuis les œufs 6 min et les petits pois 5 min.","Dispose la salade, les radis émincés, les petits pois et la feta.","Ajoute les œufs coupés en deux et une vinaigrette."],q:"spring salad radish peas egg"},
{id:"salade-endives-poire",n:"Salade d’endives, poire et noix",t:"ds",k:"L",m:10,i:[["endive",200],["poire",120],["noix",20],["comte",30],["huile",5]],e:["Émince les endives et coupe la poire en lamelles.","Ajoute les noix et le comté en dés.","Assaisonne d’huile et de vinaigre."],q:"endive pear walnut salad"},

/* ---- Soupes et veloutés ---- */
{id:"veloute-potiron",n:"Velouté de potiron",t:"s",k:"L",m:35,i:[["potiron",350],["pdt",80],["oignon",30],["creme",15],["pain",50]],e:["Fais revenir l’oignon, ajoute le potiron et la pomme de terre en morceaux, couvre d’eau.","Cuis 20 min et mixe avec la crème.","Sers avec le pain grillé."],q:"pumpkin soup"},
{id:"soupe-lentilles-corail",n:"Soupe de lentilles corail",t:"ds",k:"E",m:30,i:[["lcorail",200],["carotte",80],["tconc",100],["oignon",40],["laitcoco",30],["pain",50]],e:["Fais revenir oignon et carotte avec du cumin.","Ajoute lentilles, tomates, lait de coco et 40 cl d’eau, mijote 15 min.","Mixe à moitié et sers avec le pain."],q:"red lentil soup"},
{id:"minestrone",n:"Minestrone",t:"ds",k:"L",m:35,i:[["courgette",80],["carotte",60],["hrouges",80],["tconc",100],["pates",60],["oignon",30],["huile",5]],e:["Fais revenir oignon, carotte et courgette en dés.","Ajoute tomates, haricots et 50 cl d’eau, mijote 15 min.","Ajoute les petites pâtes 8 min avant la fin."],q:"minestrone soup"},
{id:"veloute-courgettes",n:"Velouté de courgettes au fromage frais",t:"s",k:"L",m:30,i:[["courgette",300],["pdt",100],["fb0",40],["pain",50]],e:["Cuis courgettes et pomme de terre 20 min dans l’eau salée.","Mixe avec le fromage frais.","Sers avec le pain."],q:"zucchini soup"},
{id:"soupe-oignon",n:"Soupe à l’oignon gratinée",t:"s",k:"E",m:50,i:[["oignon",200],["beurre",10],["pain",60],["emmental",30],["farine",5]],e:["Fais fondre les oignons émincés 25 min dans le beurre jusqu’à coloration.","Saupoudre de farine, mouille de 50 cl de bouillon, mijote 15 min.","Verse en bol, couvre de pain et d’emmental, gratine 5 min."],q:"french onion soup"},
{id:"veloute-petits-pois",n:"Velouté de petits pois à la menthe",t:"s",k:"L",m:25,i:[["ppoisfr",200],["pdt",60],["oignon",30],["creme",15],["pain",40]],e:["Fais revenir l’oignon, ajoute les petits pois et la pomme de terre, couvre d’eau.","Cuis 15 min et mixe avec la crème et quelques feuilles de menthe.","Sers avec le pain."],q:"green pea mint soup"},
{id:"soupe-poireaux",n:"Soupe poireaux-pommes de terre",t:"s",k:"L",m:30,i:[["poireau",200],["pdt",200],["creme",15],["pain",40]],e:["Fais suer les poireaux émincés 5 min, ajoute les pommes de terre et couvre d’eau.","Cuis 20 min, mixe avec la crème.","Sers avec le pain."],q:"leek potato soup"},
{id:"gaspacho",n:"Gaspacho",t:"ds",k:"L",m:15,i:[["tomate",300],["concombre",100],["poivron",60],["oignon",20],["huile",10],["pain",30]],e:["Mixe tomates, concombre, poivron, oignon, ail, pain rassis et huile.","Assaisonne de sel, de piment d’Espelette et de vinaigre de xérès.","Réserve 1 h au frais."],q:"gazpacho"},
{id:"soupe-miso",n:"Soupe miso, tofu et nouilles",t:"s",k:"L",m:15,i:[["miso",20],["tofu",100],["nouilles",100],["epinards",40],["champi",40],["carotte",30]],e:["Porte à frémissement 40 cl d’eau avec les champignons et la carotte, 5 min.","Ajoute le tofu en dés, les nouilles et les épinards, 2 min.","Hors du feu, délaye le miso dans le bouillon sans le faire bouillir."],q:"miso soup tofu noodles"},
{id:"veloute-champignons",n:"Velouté de champignons",t:"s",k:"L",m:30,i:[["champi",300],["pdt",80],["oignon",30],["creme",20],["pain",50]],e:["Fais revenir l’oignon et les champignons 5 min.","Ajoute la pomme de terre, couvre d’eau et cuis 15 min.","Mixe avec la crème, sers avec le pain."],q:"mushroom soup"},
{id:"soupe-pois-casses",n:"Soupe de pois cassés",t:"s",k:"E",m:50,i:[["pcasses",220],["carotte",60],["oignon",30],["pain",40]],e:["Fais revenir oignon et carotte.","Ajoute les pois cassés et 50 cl d’eau, mijote 40 min.","Mixe et sers avec des croûtons."],q:"split pea soup"},
{id:"pho-boeuf",n:"Pho au bœuf",t:"ds",k:"S",m:35,i:[["rumsteck",120],["nouilles",180],["oignon",30],["soja",10]],e:["Fais frémir 50 cl de bouillon de bœuf 20 min avec l’oignon, du gingembre, de la badiane et de la cannelle.","Dispose les nouilles et le bœuf cru en tranches très fines dans un bol.","Verse le bouillon bouillant dessus, ajoute coriandre, menthe et citron vert."],q:"beef pho"},

/* ---- Wraps, sandwichs et tartes ---- */
{id:"wraps-poulet",n:"Wraps poulet et crudités",t:"d",k:"S",m:20,i:[["tortilla",120],["poulet",130],["salade",30],["tomate",60],["mais",40],["fb0",40]],e:["Poêle le poulet en lanières avec du paprika.","Mélange fromage blanc, citron et ciboulette pour la sauce.","Garnis les tortillas et roule."],q:"chicken wraps"},
{id:"wraps-houmous",n:"Wraps houmous et légumes grillés",t:"d",k:"L",m:20,i:[["tortilla",120],["houmous",60],["courgette",100],["poivron",80],["salade",30],["huile",5]],e:["Grille courgette et poivron en lanières 8 min.","Tartine les tortillas de houmous, ajoute les légumes et la salade, puis roule."],q:"hummus veggie wrap"},
{id:"burger-frites",n:"Burger maison et frites au four",t:"ds",k:"S",m:40,i:[["painburger",75],["boeuf5",150],["emmental",20],["salade",20],["tomate",50],["oignon",20],["pdt",200],["huile",8]],e:["Coupe les pommes de terre en frites, mélange à l’huile et cuis 30 min à 220 °C.","Cuis le steak 3 min par face, ajoute l’emmental.","Monte le burger avec salade, tomate et oignon."],q:"homemade burger fries"},
{id:"pizza-tortilla",n:"Pizza tortilla jambon et champignons",t:"s",k:"E",m:15,i:[["tortilla",60],["tconc",60],["mozza",60],["jambon",60],["champi",50]],e:["Étale les tomates sur la tortilla.","Ajoute jambon, champignons et mozzarella.","Cuis 10 min à 220 °C."],q:"tortilla pizza"},
{id:"quiche-sans-pate",n:"Quiche sans pâte jambon-épinards",t:"ds",k:"S",m:35,i:[["oeuf",150],["lait",100],["jambon",60],["emmental",20],["epinards",50],["salade",50]],e:["Bats œufs et lait, ajoute jambon, épinards et emmental.","Verse dans un plat huilé, 25 min à 180 °C.","Sers avec la salade."],q:"crustless quiche spinach"},
{id:"tartine-chevre-miel",n:"Tartine gratinée chèvre-miel et salade",t:"ds",k:"E",m:15,i:[["pain",80],["chevre",50],["miel",10],["salade",80],["noix",10]],e:["Dispose le chèvre sur le pain, ajoute le miel et du thym.","Gratine 6 min au four.","Sers avec la salade et les noix."],q:"goat cheese honey toast salad"},
{id:"pita-kebab",n:"Pita au poulet façon kebab",t:"ds",k:"S",m:25,i:[["pita",80],["poulet",140],["yaourt",50],["tomate",60],["salade",30],["oignon",20]],e:["Fais mariner le poulet en lanières avec paprika, cumin et ail, puis saisis-le 6 min.","Prépare une sauce avec le yaourt, du citron et de la menthe.","Garnis la pita de poulet, de crudités et de sauce."],q:"chicken pita kebab"},
{id:"bagel-saumon",n:"Bagel saumon fumé et fromage frais",t:"d",k:"E",m:5,i:[["bagel",90],["saumonf",50],["fb0",40],["concombre",40],["salade",20]],e:["Toaste le bagel.","Tartine de fromage frais, ajoute concombre, saumon, aneth et salade."],q:"smoked salmon bagel cream cheese"},

/* ---- Desserts sains et en-cas cuisinés ---- */
{id:"energy-balls",n:"Energy balls dattes et avoine",t:"c",k:"E",m:15,i:[["dattes",40],["avoine",30],["pbutter",15],["cacao",5]],e:["Mixe tout jusqu’à obtenir une pâte.","Forme 4 boules et laisse 30 min au frais."],q:"energy balls dates oats"},
{id:"barres-cereales",n:"Barres de céréales protéinées maison",t:"c",k:"S",m:10,i:[["avoine",40],["whey",20],["pbutter",15],["miel",10]],e:["Mélange tout avec 1 c. à soupe d’eau.","Tasse en barre et laisse 1 h au frais."],q:"homemade protein bars"},
{id:"crumble-pommes-poires",n:"Crumble pommes-poires aux flocons d’avoine",t:"c",k:"E",m:40,i:[["pomme",100],["poire",100],["avoine",25],["farine",10],["beurre",10],["sucre",8]],e:["Coupe les fruits en dés dans un plat.","Sable du bout des doigts flocons, farine, beurre et sucre, émiette sur les fruits.","Cuis 30 min à 180 °C."],q:"apple pear crumble oats"},
{id:"muffins-banane",n:"Muffins banane-myrtilles",t:"c",k:"E",m:30,i:[["farine",30],["avoine",15],["banane",60],["oeuf",25],["frouges",30],["lait",30],["sucre",5]],e:["Mélange farine, flocons, levure, banane écrasée, œuf et lait.","Ajoute les myrtilles et verse dans des moules.","Cuis 20 min à 180 °C. Les quantités affichées font 2 muffins."],q:"banana blueberry muffins"},
{id:"mousse-chocolat",n:"Mousse au chocolat légère",t:"c",k:"L",m:15,i:[["choco",25],["oeuf",50],["blanc",30],["sucre",5]],e:["Fais fondre le chocolat et ajoute le jaune d’œuf.","Monte les blancs en neige avec le sucre et incorpore-les délicatement.","Réserve 3 h au frais."],q:"chocolate mousse"},
{id:"cheesecake-skyr",n:"Cheesecake au skyr",t:"c",k:"S",m:35,i:[["skyr",150],["oeuf",25],["avoine",20],["beurre",8],["miel",10],["frouges",50]],e:["Mélange flocons mixés et beurre fondu, tasse au fond de petits moules.","Fouette skyr, œuf, miel et zeste de citron, verse sur la base.","Cuis 25 min à 160 °C, laisse refroidir et sers avec les fruits rouges."],q:"skyr cheesecake berries"},
{id:"riz-au-lait",n:"Riz au lait à la vanille",t:"c",k:"E",m:40,i:[["rizrond",100],["lait",200],["sucre",10]],e:["Cuis le riz rond dans le lait avec la vanille, à feu très doux, 35 min en remuant souvent.","Sucre en fin de cuisson et laisse tiédir."],q:"rice pudding vanilla"},
{id:"clafoutis",n:"Clafoutis aux fruits de saison",t:"c",k:"E",m:45,i:[["fruitsaison",150],["oeuf",50],["lait",80],["farine",20],["sucre",10]],e:["Dispose les fruits de saison coupés dans un plat beurré.","Fouette œuf, sucre, farine et lait, verse sur les fruits.","Cuis 35 min à 180 °C."],q:"fruit clafoutis"},
{id:"pommes-au-four",n:"Pommes au four, cannelle et noix",t:"c",k:"L",m:35,i:[["pomme",200],["noix",15],["erable",10]],e:["Évide les pommes, garnis de noix concassées, de sirop d’érable et de cannelle.","Cuis 30 min à 180 °C."],q:"baked apples cinnamon walnuts"},

const OFF = "https://world.openfoodfacts.org";
const FIELDS = "code,product_name,product_name_fr,brands,quantity,product_quantity,product_quantity_unit,stores,image_front_small_url,image_small_url,nutriments";
const r1 = v => (v===null || v===undefined || v==="" || isNaN(v)) ? null : Math.round(Number(v)*10)/10;
function fromOFF(p){
  const n = p.nutriments || {};
  let k = n["energy-kcal_100g"];
  if((k===undefined || k===null) && n.energy_100g!=null) k = n.energy_100g/4.184;
  const unit = (p.product_quantity_unit||"g").toLowerCase();
  const pr = {
    id:"", code:p.code||"", name:(p.product_name_fr||p.product_name||"").trim()||"Produit sans nom",
    brand:(p.brands||"").split(",")[0].trim(), qty:p.quantity||"",
    img:p.image_front_small_url||p.image_small_url||"", offStores:p.stores||"",
    k:r1(k), p:r1(n.proteins_100g), g:r1(n.carbohydrates_100g), l:r1(n.fat_100g),
    price:null, weight:(["g","ml"].includes(unit) && Number(p.product_quantity)>0) ? Math.round(Number(p.product_quantity)) : null,
    link:"", stores:[]
  };
  pr.stores = myStores().filter(s=>storeMatch(pr.offStores, s));
  return pr;
}
/* Requête avec délai maximal, pour ne jamais rester bloqué sur un service lent */
async function fetchT(url, opts={}, ms=12000){
  const c = new AbortController(), t = setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); } finally{ clearTimeout(t); }
}
/* Limiteur côté app : Open Food Facts autorise 10 recherches par minute et par IP.
   On reste en dessous (6 requêtes par minute) et on observe une pause après un bridage. */
const Gate = {
  hits:[], until:0,
  wait(){ const now = Date.now(); this.hits = this.hits.filter(t=>now-t<60000);
    if(this.until>now) return Math.ceil((this.until-now)/1000);
    return this.hits.length>=6 ? Math.ceil((60000-(now-this.hits[0]))/1000) : 0; },
  note(){ this.hits.push(Date.now()); },
  block(sec){ this.until = Math.max(this.until, Date.now()+sec*1000); }
};
/* Résultats de recherche gardés 7 jours sur l’appareil : une même recherche ne coûte rien */
const SearchCache = {
  key:"assiette.search", ttl:7*864e5,
  all(){ try{ return JSON.parse(localStorage.getItem(this.key)||"{}"); }catch(e){ return {}; } },
  rehydrate(list){ return list.map(x=>({...x, stores:myStores().filter(st=>storeMatch(x.offStores, st))})); },
  get(q){ const c = this.all()[norm(q)]; return c && Date.now()-c.t<this.ttl ? this.rehydrate(c.r) : null; },
  put(q, list){
    const c = this.all(); c[norm(q)] = {t:Date.now(), r:list.slice(0,40)};
    const o = {}; Object.keys(c).sort((a,b)=>c[b].t-c[a].t).slice(0,30).forEach(k=>o[k]=c[k]);
    try{ localStorage.setItem(this.key, JSON.stringify(o)); }catch(e){}
  },
  /* Secours hors ligne : produits déjà vus dont le nom contient les mots cherchés */
  seen(q){
    const words = norm(q).split(" ").filter(w=>w.length>1), out = new Map();
    Object.values(this.all()).forEach(c=>c.r.forEach(x=>{ const n = norm(x.name+" "+x.brand); if(words.every(w=>n.includes(w)) && x.code && !out.has(x.code)) out.set(x.code, x); }));
    return this.rehydrate([...out.values()]);
  }
};
/* Les champs du nouveau moteur peuvent être du texte, une liste ou un objet par langue */
const pickTxt = v => v==null ? "" : Array.isArray(v) ? v.filter(Boolean).join(", ") : typeof v==="object" ? String(v.fr||v.main||v.en||Object.values(v)[0]||"") : String(v);
const ProductSource = {
  /* 1) Search-a-licious (nouveau moteur), 2) ancienne recherche en secours */
  async search(term){
    const err = (status, name) => Object.assign(new Error("search"), {status, name: name||"SearchError"});
    const clean = term.replace(/[+\-!(){}\[\]^"~*?:\\/&|]/g," ").replace(/\s+/g," ").trim();
    if(!clean) return [];
    let sal = 0;
    try{
      Gate.note();
      const qs = new URLSearchParams({q:`(${clean}) AND countries_tags:"en:france"`, langs:"fr", page_size:40, fields:FIELDS});
      const r = await fetchT(`https://search.openfoodfacts.org/search?${qs}`);
      sal = r.status;
      if(r.ok){
        const j = await r.json();
        const hits = (j.hits||[]).filter(h=>h && h.code).map(h=>fromOFF({
          code:h.code, product_name_fr:pickTxt(h.product_name_fr), product_name:pickTxt(h.product_name), brands:pickTxt(h.brands),
          quantity:pickTxt(h.quantity), product_quantity:h.product_quantity, product_quantity_unit:pickTxt(h.product_quantity_unit),
          stores:pickTxt(h.stores)||pickTxt(h.stores_tags), image_front_small_url:pickTxt(h.image_front_small_url), image_small_url:pickTxt(h.image_small_url),
          nutriments:h.nutriments||{}}));
        if(hits.length) return hits;
      }
    }catch(e){ if(e.name==="AbortError") sal = -1; }
    /* Bridage (429/503) : la limite est commune aux deux moteurs, inutile d’insister */
    if(sal===429 || sal===503) throw err(sal);
    Gate.note();
    let r;
    try{
      const qs = new URLSearchParams({search_terms:clean, search_simple:1, action:"process", json:1, page_size:40,
        tagtype_0:"countries", tag_contains_0:"contains", tag_0:"france", fields:FIELDS});
      r = await fetchT(`${OFF}/cgi/search.pl?${qs}`, {}, 20000);
    }catch(e){ throw err(0, e.name==="AbortError" ? "AbortError" : "NetworkError"); }
    if(!r.ok) throw err(r.status);
    const j = await r.json();
    return (j.products||[]).map(fromOFF);
  },
  async barcode(code){
    const r = await fetchT(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${FIELDS}`);
    if(r.status===404) return null;
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return j.status===1 && j.product ? fromOFF({...j.product, code}) : null;
  },
  /* Prix réels relevés par les consommateurs, avec le magasin précis */
  async prices(code){
    const qs = new URLSearchParams({product_code:code, order_by:"-date", size:50});
    const r = await fetchT(`https://prices.openfoodfacts.org/api/v1/prices?${qs}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return (j.items||[]).filter(x=>(x.currency||"EUR")==="EUR" && x.price>0).map(x=>{
      const loc = x.location||{}, prod = x.product||{};
      const unit = (prod.product_quantity_unit||"g").toLowerCase(), q = Number(prod.product_quantity)||0;
      const ppk = x.price_per==="KILOGRAM" ? x.price : (q>0 && ["g","ml"].includes(unit) ? x.price/(q/1000) : null);
      const label = [loc.osm_brand, loc.osm_name].filter(Boolean).join(" ").trim();
      return {price:x.price, per:x.price_per, ppk, weight:x.price_per==="KILOGRAM"?1000:(q||null), date:x.date,
        brand:loc.osm_brand||"", name:loc.osm_name||"", city:loc.osm_address_city||"", logo:loc.osm_brand_logo_url||"",
        store:myStores().find(s=>storeMatch(label, s))||""};
    });
  }
};

function sane(s){
  s = s && typeof s==="object" ? s : {};
  if(!Array.isArray(s.favs)) s.favs = [];
  if(!Array.isArray(s.pantry)) s.pantry = [];
  if(!s.list || typeof s.list!=="object") s.list = {};
  if(!Array.isArray(s.checked)) s.checked = [];
  if(s.profile===undefined) s.profile = null;
  if(s.profile){ if(s.profile.budget===undefined) s.profile.budget = ""; if(!s.profile.personnes) s.profile.personnes = 1; if(s.profile.prefSaison===undefined) s.profile.prefSaison = false; }
  /* Version 4 : les favoris passent des positions aux identifiants stables */
  s.favs = [...new Set(s.favs.map(f=>typeof f==="number" ? (MIGRATE[f]||[])[0] : f).filter(id=>id && BYID[id]))];
  s.pantry.forEach(x=>{ if(x.price===undefined) x.price = null; if(x.weight===undefined) x.weight = null; });
  return s;
}

const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.\-]/g," ").replace(/\s+/g," ").trim();
function myStores(){ const p = S.profile || UI.draft; return [...(p.magasins||[]), ...(p.autreMagasin?[p.autreMagasin.trim()]:[])].filter(Boolean); }
function storeMatch(text, store){ const t = " "+norm(text)+" "; const al = STORE_INFO[store] ? STORE_INFO[store].a : [norm(store)]; return al.some(a=>t.includes(a)); }
const linked = id => S.pantry.find(x=>x.link===id);
function ingVals(id){ const x = ING[id], pr = linked(id); return pr ? [x[0], pr.k, pr.p, pr.g, pr.l, x[5]] : x; }
function ingPrice(id){ const pr = linked(id); return (pr && pr.price>0 && pr.weight>0) ? pr.price/pr.weight*1000 : PRICE[id]; }
function mac(r){
  let k=0,p=0,g=0,l=0;
  for(const [id,q] of r.i){ const x = ingVals(id); k+=x[1]*q/100; p+=x[2]*q/100; g+=x[3]*q/100; l+=x[4]*q/100; }
  return {k,p,g,l};
}
const cost = r => r.i.reduce((t,[id,q])=>t+ingPrice(id)*q/1000, 0);
/* Saison, régimes : calculés à partir des ingrédients */
const MONTH = new Date().getMonth()+1;
function seasonInfo(r){
  const prod = r.i.map(([id])=>id).filter(id=>SEASON[id]);
  const off = prod.filter(id=>!SEASON[id].includes(MONTH));
  return {has:prod.length>0, ok:prod.length>0 && !off.length, off};
}
const monthsTxt = id => { const m = SEASON[id]; if(!m || m.length===12) return "toute l’année"; return `${MONTHS[m[0]-1]} à ${MONTHS[m[m.length-1]-1]}`; };
const isVeg = r => r.i.every(([id])=>!ING[id][5].split(" ").some(t=>MEAT.includes(t)));
const isVegan = r => isVeg(r) && r.i.every(([id])=>!/oeuf|lait/.test(ING[id][5]) && id!=="miel");
const PROFILES = {S:"Sportif",E:"Équilibré",L:"Léger"};

function needs(p){
  const bmr = 10*p.poids + 6.25*p.taille - 5*p.age + (p.sexe==="h" ? 5 : -161);
  const a = ACT[p.activite], g = GOALS[p.objectif];
  const tdee = bmr*a.f;
  const kcal = Math.round(tdee*g.k/10)*10;
  /* Besoins en protéines modulés par l’activité : un sédentaire n’a pas les besoins d’un sportif */
  const pf = {sedentaire:0.6, leger:0.75, modere:0.9, intense:1, extreme:1}[p.activite] || 1;
  const pk = Math.round(g.p*pf*100)/100;
  const prot = Math.round(pk*p.poids);
  const lip = Math.round(g.lip*p.poids);
  const gluc = Math.max(50, Math.round((kcal - prot*4 - lip*9)/4));
  const b = Number(p.budget)>0 ? Number(p.budget)/Math.max(1, Number(p.personnes)||1)/30.4 : 0;
  const ut = (["intense","extreme"].includes(p.activite) || ["masse","perf"].includes(p.objectif)) ? "S" : (p.activite==="sedentaire" || p.objectif==="seche") ? "L" : "E";
  return {bmr, tdee, kcal, prot, pk, lip, gluc, a, g, day:b, ut, ps:!!p.prefSaison};
}
function allowed(r, p){
  const ex = new Set(p.exclus);
  if(p.vege) MEAT.forEach(t=>ex.add(t));
  const avoid = (p.eviter||"").split(/[,;\n]/).map(norm).filter(w=>w.length>2);
  return r.i.every(([id])=>{
    const tags = ING[id][5].split(" ").filter(Boolean);
    if(tags.some(t=>ex.has(t))) return false;
    const name = norm(ING[id][0]);
    return !avoid.some(w=>name.includes(w));
  });
}
function fit(r, n, type){
  const m = mac(r), target = n.kcal*MEALS[type].s;
  let f = Math.round((target/m.k)*4)/4;
  f = Math.min(2.5, Math.max(0.5, f));
  const tP = n.prot*4/n.kcal, tG = n.gluc*4/n.kcal;
  const pS = m.p*4/m.k, gS = m.g*4/m.k;
  const c = cost(r)*f, cap = n.day ? n.day*MEALS[type].c : 0;
  let score = Math.abs(pS-tP)*2 + Math.abs(gS-tG) + Math.abs(target/(m.k*f)-1)*1.5;
  if(cap && c>cap) score += (c/cap-1)*1.5;
  /* Profil : un sédentaire reçoit surtout des plats équilibrés ou légers, un sportif plus de plats riches */
  if(r.k===n.ut) score -= .25;
  else if(r.k==="E" && n.ut==="L") score -= .12;
  else if(n.ut==="L" && r.k==="S") score += .3;
  else if(n.ut==="S" && r.k==="L") score += .15;
  const si = seasonInfo(r);
  if(n.ps){ if(si.ok) score -= .3; else if(si.off.length) score += .25; }
  return {f, score, m, c, cap, over: cap>0 && c>cap*1.05, si};
}
function ranked(type, n, p, exclude){
  return RECIPES.filter(r=>r.t.includes(type) && allowed(r,p) && r.id!==exclude)
    .map(r=>({r, ...fit(r,n,type)})).sort((a,b)=>a.score-b.score);
}
function guessLink(name){
  const n = " "+norm(name)+" ";
  let best = "", bs = 0;
  for(const [id,x] of Object.entries(ING)){
    const words = norm(x[0].replace(/\(.*?\)/g,"")).split(/[^a-z0-9œ]+/).filter(w=>w.length>3);
    if(!words.length) continue;
    const s = words.filter(w=>n.includes(w)).length/words.length;
    if(s>bs){ bs=s; best=id; }
  }
  return bs>=0.5 ? best : "";
}
const searchTerm = id => ING[id][0].replace(/\(.*?\)/g,"").trim();

const BADGE_COLORS = ["#ffd9cc","#d6e6ff","#ffe9b3","#ead9ff","#d4f2e1","#fde2ef"];
function hashStr(s){ let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); }
function storeAbbr(s){ const w = norm(s).split(" ").filter(Boolean); return (w.length>1 ? w.map(x=>x[0]).join("").slice(0,2) : w.join("").slice(0,3)).toUpperCase(); }
function badgeHTML(s){ return `<span class="sb" style="--sb:${BADGE_COLORS[hashStr(norm(s))%BADGE_COLORS.length]}">${esc(storeAbbr(s))}</span>`; }
/* Icône officielle de l’enseigne, chargée depuis son propre site via le service d’icônes de Google */

/* =========================================================
   PHOTOS DES PLATS (Unsplash, banque d’images gratuite)
   La clé est saisie dans l’app et reste sur le téléphone :
   elle n’apparaît jamais dans le dépôt GitHub.
   Limite gratuite (mode démo) : 50 requêtes par heure.
   Les fichiers images ne comptent pas dans cette limite.
   ========================================================= */
/* Anciennes photos rangées par position : reprises sous le nouvel identifiant si elles correspondent au plat */
function migrateKeys(obj){
  const out = {};
  Object.entries(obj||{}).forEach(([k,v])=>{ if(BYID[k]){ out[k] = v; return; } const m = MIGRATE[k]; if(m && m[1] && !out[m[0]]) out[m[0]] = v; });
  return out;
}
const Pics = {
  key:(()=>{ try{ return localStorage.getItem("assiette.unsplash")||""; }catch(e){ return ""; } })(),
  cache:(()=>{ try{ const raw = JSON.parse(localStorage.getItem("assiette.pics")||"{}"), c = migrateKeys(raw);
    if(Object.keys(raw).some(k=>!BYID[k])) localStorage.setItem("assiette.pics", JSON.stringify(c)); return c; }catch(e){ return {}; } })(),
  shared:{}, queue:[], busy:0, pending:new Set(), blocked:false, err:"", warm:false,
  async loadShared(){
    try{ const r = await fetch("photos.json", {cache:"no-cache"}); if(!r.ok) return; const j = await r.json(); if(j && j.photos) this.shared = migrateKeys(j.photos); }catch(e){}
  },
  entry(id){ return this.cache[id] || this.shared[id]; },
  save(){ try{ localStorage.setItem("assiette.pics", JSON.stringify(this.cache)); }catch(e){} },
  setKey(k){ this.key = k.trim(); this.blocked = false; this.err = ""; try{ this.key ? localStorage.setItem("assiette.unsplash", this.key) : localStorage.removeItem("assiette.unsplash"); }catch(e){} },
  count(){ return RECIPES.filter(r=>{ const c = this.entry(r.id); return c && c.list.length; }).length; },
  sharedCount(){ return Object.values(this.shared).filter(c=>c && c.list && c.list.length).length; },
  get(id){ const c = this.entry(id); return c && c.list.length ? c.list[c.i % c.list.length] : null; },
  exportJSON(){
    const photos = {};
    RECIPES.forEach(r=>{ const c = this.entry(r.id); if(c && c.list.length) photos[r.id] = {i:c.i % c.list.length, list:c.list}; });
    return {app:"assiette", version:2, source:"unsplash", date:new Date().toISOString(), count:Object.keys(photos).length, photos};
  },
  want(id){ if(!this.key || this.blocked || this.entry(id) || this.pending.has(id) || !navigator.onLine) return; this.pending.add(id); this.queue.push(id); this.pump(); },
  pump(){
    while(this.busy<2 && this.queue.length){ const id = this.queue.shift(); this.busy++; this.fetch(id).finally(()=>{ this.busy--; this.pending.delete(id); this.pump(); }); }
    if(!this.busy && !this.queue.length && this.warm){ this.warm = false; toast(this.blocked ? this.err : `Photos prêtes : ${this.count()} sur ${RECIPES.length}.`); if(UI.view==="profile") render(); }
  },
  async fetch(id){
    try{
      const r = await fetch(`https://api.unsplash.com/search/photos?${new URLSearchParams({query:BYID[id].q, per_page:8, orientation:"landscape", content_filter:"high"})}`, {headers:{Authorization:"Client-ID "+this.key, "Accept-Version":"v1"}});
      if(r.status===401){ this.blocked = true; this.err = "Clé Unsplash refusée : vérifie la clé d’accès (Access Key) dans Profil."; this.queue = []; return; }
      if(r.status===403 || r.status===429){ this.blocked = true; this.err = "Limite Unsplash atteinte (50 recettes par heure). Relance « Précharger tout » dans une heure pour la suite."; this.queue = []; return; }
      if(!r.ok) return;
      const j = await r.json(), utm = "utm_source=assiette&utm_medium=referral";
      const sz = (raw,w,h)=>`${raw}${raw.includes("?")?"&":"?"}w=${w}&h=${h}&fit=crop&auto=format&q=70`;
      this.cache[id] = {i:0, list:(j.results||[]).map(p=>({s:sz(p.urls.raw,260,260), m:sz(p.urls.raw,800,380), l:sz(p.urls.raw,1080,560),
        ph:p.user.name, pu:`${p.user.links.html}?${utm}`, u:`https://unsplash.com/?${utm}`, c:p.color}))};
      this.save(); refreshPic(id);
      if(UI.sheet && UI.sheet.kind==="recipe" && UI.sheet.id===id) renderSheet();
      if(this.warm){ const p = this.get(id); if(p) [p.s,p.m].forEach(u=>fetch(u,{mode:"no-cors"}).catch(()=>{})); }
    }catch(e){}
  }
};
function refreshPic(id){ document.querySelectorAll(`[data-pic="${id}"]`).forEach(el=>{ el.innerHTML = visual(BYID[id], el.dataset.size); }); }

/* =========================================================
   PHOTOS PERSONNELLES (IndexedDB, sur le téléphone)
   ========================================================= */
const Photos = {
  db:null, urls:{},
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((ok,ko)=>{ const q = indexedDB.open("assiette-photos",1);
      q.onupgradeneeded = ()=>q.result.createObjectStore("photos");
      q.onsuccess = ()=>{ this.db = q.result; ok(this.db); }; q.onerror = ()=>ko(q.error); });
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((ok,ko)=>{ const t = db.transaction("photos",mode); fn(t.objectStore("photos")); t.oncomplete = ()=>ok(); t.onerror = ()=>ko(t.error); t.onabort = ()=>ko(t.error); });
  },
  async loadAll(){
    const old = [];
    try{ await this.run("readonly", st=>{ const c = st.openCursor(); c.onsuccess = ()=>{ const cur = c.result; if(cur){ if(typeof cur.key==="number") old.push([cur.key, cur.value]); else this.urls[cur.key] = URL.createObjectURL(cur.value); cur.continue(); } }; }); }catch(e){}
    /* Version 4 : tes photos passent des positions aux identifiants stables */
    for(const [k, blob] of old){
      try{ const m = MIGRATE[k]; if(m && m[1] && !this.urls[m[0]]) await this.put(m[0], blob); await this.run("readwrite", st=>st.delete(k)); }catch(e){}
    }
  },
  async put(id, blob){ await this.run("readwrite", st=>st.put(blob,id)); if(this.urls[id]) URL.revokeObjectURL(this.urls[id]); this.urls[id] = URL.createObjectURL(blob); },
  async del(id){ await this.run("readwrite", st=>st.delete(id)); if(this.urls[id]){ URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; } },
  async clear(){ try{ await this.run("readwrite", st=>st.clear()); }catch(e){} Object.values(this.urls).forEach(u=>URL.revokeObjectURL(u)); this.urls = {}; }
};
async function resizeImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){ bmp = await createImageBitmap(file); }
  const max = 1000, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error("jpeg")),"image/jpeg",.82));
}
function picURL(r, size="s"){
  const own = Photos.urls[r.id]; if(own) return own;
  const p = Pics.get(r.id); if(p) return p[size]||p.m;
  Pics.want(r.id); return "";
}
function visual(r, size="s"){
  const u = picURL(r, size);
  if(u) return `<img src="${esc(u)}" alt="${esc(r.n)}" loading="lazy"${!Photos.urls[r.id]&&Pics.get(r.id)?` style="background:${esc(Pics.get(r.id).c||"transparent")}"`:""}>`;
  return `<span class="ph-empty">${MEALS[r.t[0]].l}</span>`;
}

    <div class="chips"><button class="chip" data-a="vege" ${pressed(d.vege)}>Végétarien</button><button class="chip" data-a="saison" ${pressed(d.prefSaison)}>Je privilégie les produits de saison</button></div>
    <div><label class="f">Je ne mange pas</label><div class="chips">${Object.entries(TAGS).map(([k,l])=>`<button class="chip" data-a="toggle" data-f="exclus" data-v="${k}" ${pressed(d.exclus.includes(k)||(d.vege&&MEAT.includes(k)))}>${l}</button>`).join("")}</div></div>
    <div><label class="f" for="eviter">Autres aliments que je n’aime pas</label><textarea id="eviter" data-f="eviter" placeholder="Sépare par des virgules : champignons, avocat…">${esc(d.eviter)}</textarea></div></div>`;
}
function fBudget(d){
  const per = Number(d.budget)>0 ? Number(d.budget)/Math.max(1,Number(d.personnes)||1)/30.4 : 0;
  return `<div class="stack">
    <div class="grid3" style="grid-template-columns:2fr 1fr">
      <div><label class="f" for="budget">Budget courses par mois (€)</label><input id="budget" type="number" inputmode="decimal" min="0" step="10" data-f="budget" placeholder="ex. 300" value="${esc(d.budget)}"></div>
      <div><label class="f" for="pers">Personnes</label><input id="pers" type="number" inputmode="numeric" min="1" max="12" data-f="personnes" value="${d.personnes||1}"></div>
    </div>
    <p class="small muted" id="budgethint">${per?`Soit environ <b>${eur(per)}</b> par jour et par personne. Les recettes trop chères pour ce budget passeront après les autres.`:"Laisse vide si tu ne veux pas tenir compte du budget."}</p>
    <p class="small muted">Les coûts sont estimés à partir de prix moyens en grande surface. Ils deviennent exacts pour chaque produit de ton garde-manger dont tu indiques le prix.</p></div>`;
}
function fStores(d){
  return `<div class="stack"><div class="stores">${STORES.map(s=>`<button class="store" data-a="toggle" data-f="magasins" data-v="${s}" ${pressed(d.magasins.includes(s))}><span class="chk">${icon("check")}</span>${logo(s)}<span>${s}</span></button>`).join("")}</div>
    <div><label class="f" for="autre">Autre magasin</label><input id="autre" type="text" data-f="autreMagasin" placeholder="ex. Biocoop du quartier" value="${esc(d.autreMagasin)}"></div>
    <p class="muted small">Les produits et les prix relevés dans tes magasins remonteront en premier.</p></div>`;
}
