<style>
:root{
  --bg:#14201c;--surface:#1c2924;--surface2:#25352e;--line:#33463e;
  --text:#e7ede6;--muted:#9fb1a7;--accent:#a6dcb5;--on-accent:#10201a;
  --p:#7cc3e6;--g:#e8c46b;--l:#c9a2e9;--warn:#f2b3a0;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:20px 18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:600;margin-bottom:10px}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:14px}
.section{margin-top:30px}
.lead{margin:6px 0 18px}

.kcal{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.02em;margin-top:14px}
.kcal small{font-size:20px;font-weight:600;color:var(--muted);margin-left:6px}
.band{display:flex;height:44px;border-radius:var(--r-sm);overflow:hidden;margin-top:18px}
.band span{display:block;height:100%}
.band .bp{background:var(--p)}.band .bg{background:var(--g)}.band .bl{background:var(--l)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.legend div{border-left:4px solid;padding-left:8px}
.legend b{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.legend .lp{border-color:var(--p)}.legend .lg{border-color:var(--g)}.legend .ll{border-color:var(--l)}
details{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-top:16px}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:18px}
details li{margin:4px 0}

.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.card h3{margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font-size:13px;background:var(--surface2);border-radius:999px;padding:2px 10px;color:var(--muted)}
.pill.hl{color:var(--on-accent);background:var(--accent)}
.macros{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}
.macros i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dp{background:var(--p)}.dg{background:var(--g)}.dl{background:var(--l)}
.link{background:none;border:none;color:var(--accent);font-weight:700;padding:6px 0}
.total{background:var(--surface2);border-radius:var(--r-md);padding:12px 14px;margin-top:22px}
.list>*+*{margin-top:10px}

label.f{display:block;font-weight:700;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=number],input[type=text],input[type=search],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:var(--surface);border-radius:var(--r-sm);padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:6px;padding:9px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.opts>*+*{margin-top:8px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--surface2)}
.opt b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{white-space:nowrap;flex:none}
.btn{border:none;border-radius:var(--r-md);padding:14px 18px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.err{color:var(--warn);font-weight:700}
.steps{display:flex;gap:6px;margin:6px 0 22px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-md);padding:16px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border-radius:var(--r-md);padding:10px 14px;margin-top:12px}

/* Produits */
.prow{display:flex;gap:12px;align-items:center}
.pimg{width:56px;height:56px;border-radius:var(--r-sm);object-fit:contain;background:#f4f4f0;flex:none}
.pimg.none{display:flex;align-items:center;justify-content:center;color:#55615b;font-size:22px}
.prow h3{font-size:16px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1}
.searchrow .btn{padding:11px 16px}

/* Courses */
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 0}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:800;margin-top:1px}
.check[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed=true] .ct{text-decoration:line-through;color:var(--muted)}
.check .ct{flex:1}
.check b{white-space:nowrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;max-width:140px;border:none;background:none;padding:7px 2px;border-radius:var(--r-sm);color:var(--muted);font-weight:700;font-size:12px}
nav.tabs button span{display:block;font-size:19px;line-height:1.2}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--surface2)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,8,.6)}
.sheet[hidden]{display:none}
.sheet-in{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{border:none;background:var(--surface2);border-radius:50%;width:38px;height:38px;flex:none;font-size:18px}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:10px 12px;margin-top:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface2);font-size:20px;font-weight:700}
.stepper div{flex:1}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ing li .n{flex:1}
.ing li b{white-space:nowrap}
.ing .link{padding:0;font-size:14px}
ol.how{padding-left:22px;margin:0}
ol.how li{margin:8px 0}
.video{position:relative;border-radius:var(--r-md);overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:14px}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
/* Visuels */
.card.dish{padding:0;overflow:hidden;display:flex;align-items:stretch}
.thumb{background:radial-gradient(circle at 30% 25%,#2d433a,#1a2722);display:flex;align-items:center;justify-content:center;flex:none}
.card.dish .thumb{width:112px;min-height:112px}
.card.dish .cb{padding:12px 14px;flex:1;min-width:0}
.card.dish.big{flex-direction:column}
.card.dish.big .thumb{width:100%;height:180px}
.thumb img.ph{width:100%;height:100%;object-fit:cover;display:block}
.hero{margin:14px -18px 0;height:250px;overflow:hidden}
.hero img.ph{width:100%;height:100%;object-fit:cover}
.ph-empty{color:var(--muted);font-size:12px;text-align:center;padding:6px}
.credit{font-size:12px;color:var(--muted);margin-top:6px}
.credit a{color:var(--muted)}
.photo-actions{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.sb{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 5px;border-radius:6px;background:var(--sb);color:#10201a;font:800 11px/1 var(--display);letter-spacing:.03em;margin-right:7px;vertical-align:middle;flex:none}
.sb.lg{height:32px;min-width:44px;font-size:14px;border-radius:9px;margin-right:10px}
.chip .sb{margin-left:-7px;height:20px;min-width:28px}
.pill .sb{height:16px;min-width:24px;font-size:9px;margin:0 5px 0 -6px;border-radius:4px}
.storehead{display:flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:999px;z-index:30;max-width:90%;text-align:center}
.toast[hidden]{display:none}
</style>
</head>

  let k = n["energy-kcal_100g"];
  if((k===undefined || k===null) && n.energy_100g!=null) k = n.energy_100g/4.184;
  const pr = {
    id:"", code:p.code||"", name:(p.product_name_fr||p.product_name||"").trim()||"Produit sans nom",
    brand:(p.brands||"").split(",")[0].trim(), qty:p.quantity||"",
    img:p.image_front_small_url||p.image_small_url||"", offStores:p.stores||"",
    k:r1(k), p:r1(n.proteins_100g), g:r1(n.carbohydrates_100g), l:r1(n.fat_100g),
    link:"", stores:[]
  };
  pr.stores = myStores().filter(s=>storeMatch(pr.offStores, s));
  return pr;
}
const ProductSource = {
  async search(term){
    const qs = new URLSearchParams({search_terms:term, search_simple:1, action:"process", json:1, page_size:40,
      tagtype_0:"countries", tag_contains_0:"contains", tag_0:"france", fields:FIELDS});
    const r = await fetch(`${OFF}/cgi/search.pl?${qs}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return (j.products||[]).map(fromOFF);
  },
  async barcode(code){
    const r = await fetch(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${FIELDS}`);
    if(r.status===404) return null;
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return j.status===1 && j.product ? fromOFF({...j.product, code}) : null;
  }
};

const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
function myStores(){ const p = S.profile || UI.draft; return [...(p.magasins||[]), ...(p.autreMagasin?[p.autreMagasin.trim()]:[])].filter(Boolean); }
function storeMatch(offStores, store){ return norm(offStores).includes(norm(store)); }
const linked = id => S.pantry.find(x=>x.link===id);

/* Valeurs d’un ingrédient : produit associé si présent, sinon Ciqual */
function ingVals(id){
  const x = ING[id], pr = linked(id);
  return pr ? [x[0], pr.k, pr.p, pr.g, pr.l, x[5]] : x;
}
function mac(r){
  let k=0,p=0,g=0,l=0;
  for(const [id,q] of r.i){ const x = ingVals(id); k+=x[1]*q/100; p+=x[2]*q/100; g+=x[3]*q/100; l+=x[4]*q/100; }
  return {k,p,g,l};
}
RECIPES.forEach((r,idx)=>{ r.id = idx; });

function needs(p){
  const bmr = 10*p.poids + 6.25*p.taille - 5*p.age + (p.sexe==="h" ? 5 : -161);
  const a = ACT[p.activite], g = GOALS[p.objectif];
  const tdee = bmr*a.f;
  const kcal = Math.round(tdee*g.k/10)*10;
  const prot = Math.round(g.p*p.poids);
  const lip = Math.round(g.lip*p.poids);
  const gluc = Math.max(50, Math.round((kcal - prot*4 - lip*9)/4));
  return {bmr, tdee, kcal, prot, lip, gluc, a, g};
}
function allowed(r, p){
  const ex = new Set(p.exclus);
  if(p.vege) MEAT.forEach(t=>ex.add(t));
  const avoid = (p.eviter||"").split(/[,;\n]/).map(norm).filter(w=>w.length>2);
  return r.i.every(([id])=>{
    const tags = ING[id][5].split(" ").filter(Boolean);
    if(tags.some(t=>ex.has(t))) return false;
    const name = norm(ING[id][0]);
    return !avoid.some(w=>name.includes(w));
  });
}
function fit(r, n, type){
  const m = mac(r), target = n.kcal*MEALS[type].s;
  let f = Math.round((target/m.k)*4)/4;
  f = Math.min(2.5, Math.max(0.5, f));
  const tP = n.prot*4/n.kcal, tG = n.gluc*4/n.kcal;
  const pS = m.p*4/m.k, gS = m.g*4/m.k;
  const score = Math.abs(pS-tP)*2 + Math.abs(gS-tG) + Math.abs(target/(m.k*f)-1)*1.5;
  return {f, score, m};
}
function ranked(type, n, p, exclude){
  return RECIPES.filter(r=>r.t.includes(type) && allowed(r,p) && r.id!==exclude)
    .map(r=>({r, ...fit(r,n,type)})).sort((a,b)=>a.score-b.score);
}
function guessLink(name){
  const n = " "+norm(name)+" ";
  let best = "", bs = 0;
  for(const [id,x] of Object.entries(ING)){
    const words = norm(x[0].replace(/\(.*?\)/g,"")).split(/[^a-z0-9œ]+/).filter(w=>w.length>3);
    if(!words.length) continue;
    const s = words.filter(w=>n.includes(w)).length/words.length;
    if(s>bs){ bs=s; best=id; }
  }
  return bs>=0.5 ? best : "";
}
const searchTerm = id => ING[id][0].replace(/\(.*?\)/g,"").trim();

/* =========================================================
   PHOTOS PERSONNELLES (IndexedDB, sur le téléphone)
   ========================================================= */
const Photos = {
  db:null, urls:{},
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((ok,ko)=>{ const q = indexedDB.open("assiette-photos",1);
      q.onupgradeneeded = ()=>q.result.createObjectStore("photos");
      q.onsuccess = ()=>{ this.db = q.result; ok(this.db); }; q.onerror = ()=>ko(q.error); });
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((ok,ko)=>{ const t = db.transaction("photos",mode); fn(t.objectStore("photos")); t.oncomplete = ()=>ok(); t.onerror = ()=>ko(t.error); t.onabort = ()=>ko(t.error); });
  },
  async loadAll(){
    try{ await this.run("readonly", st=>{ const c = st.openCursor(); c.onsuccess = ()=>{ const cur = c.result; if(cur){ this.urls[cur.key] = URL.createObjectURL(cur.value); cur.continue(); } }; }); }catch(e){}
  },
  async put(id, blob){ await this.run("readwrite", st=>st.put(blob,id)); if(this.urls[id]) URL.revokeObjectURL(this.urls[id]); this.urls[id] = URL.createObjectURL(blob); },
  async del(id){ await this.run("readwrite", st=>st.delete(id)); if(this.urls[id]){ URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; } },
  async clear(){ try{ await this.run("readwrite", st=>st.clear()); }catch(e){} Object.values(this.urls).forEach(u=>URL.revokeObjectURL(u)); this.urls = {}; }
};
async function resizeImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){ bmp = await createImageBitmap(file); }
  const max = 1000, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error("jpeg")),"image/jpeg",.82));
}
function visual(r, size="s"){
  const own = Photos.urls[r.id];
  if(own) return `<img class="ph" src="${own}" alt="Ta photo : ${esc(r.n)}">`;
  const p = Pics.get(r.id);
  if(p) return `<img class="ph" src="${esc(p[size]||p.m)}" alt="${esc(r.n)}" loading="lazy" style="background:${esc(p.c||"transparent")}">`;
  Pics.want(r.id);
  return `<span class="ph-empty">${MEALS[r.t[0]].l}</span>`;
}

    if(!list.length) return `<div class="section"><h2>${MEALS[t].l}</h2><div class="empty">Aucune recette ne passe tes exclusions pour ce repas. Assouplis-les dans Profil.</div></div>`;
    const pick = list[UI.offsets[t] % list.length];
    if(t==="d") prevD = pick.r.id;
    UI.day.push({id:pick.r.id, f:pick.f});
    const m = pick.m;
    sum.k+=m.k*pick.f; sum.p+=m.p*pick.f; sum.g+=m.g*pick.f; sum.l+=m.l*pick.f;
    return `<div class="section"><div class="meal-head"><h2 style="margin:0">${MEALS[t].l}</h2><span class="muted small">cible ${nf(n.kcal*MEALS[t].s)} kcal</span></div>
      ${card(pick.r, pick.f, true)}
      <button class="link" data-a="reroll" data-t="${t}">Autre idée</button></div>`;
  }).join("");
  return `<h1>Ta journée</h1>
    <p class="muted">${GOALS[p.objectif].l}${p.sport?`, ${esc(p.sport)}`:""}</p>
    <div class="kcal">${nf(n.kcal)}<small>kcal par jour</small></div>
    <div class="band" role="img" aria-label="Répartition : ${n.prot} g de protéines, ${n.gluc} g de glucides, ${n.lip} g de lipides">
      <span class="bp" style="width:${pk/tot*100}%"></span><span class="bg" style="width:${gk/tot*100}%"></span><span class="bl" style="width:${lk/tot*100}%"></span></div>
    <div class="legend"><div class="lp"><b>${n.prot} g</b><span class="small muted">protéines</span></div><div class="lg"><b>${n.gluc} g</b><span class="small muted">glucides</span></div><div class="ll"><b>${n.lip} g</b><span class="small muted">lipides</span></div></div>
    <details><summary>Comment c’est calculé</summary><ul class="small">
      <li>Métabolisme de base (Mifflin-St Jeor) : 10 × ${nf(p.poids,1)} + 6,25 × ${p.taille} − 5 × ${p.age} ${p.sexe==="h"?"+ 5":"− 161"} = <b>${nf(n.bmr)} kcal</b></li>
      <li>Dépense totale : ${nf(n.bmr)} × ${nf(n.a.f,3)} (activité ${n.a.l.toLowerCase()}) = <b>${nf(n.tdee)} kcal</b></li>
      <li>Objectif ${n.g.l.toLowerCase()} : × ${nf(n.g.k,2)} = <b>${nf(n.kcal)} kcal</b></li>
      <li>Protéines : ${nf(n.g.p,1)} g × ${nf(p.poids,1)} kg = <b>${n.prot} g</b></li>
      <li>Lipides : ${nf(n.g.lip,1)} g × ${nf(p.poids,1)} kg = <b>${n.lip} g</b></li>
      <li>Glucides : le reste des calories ÷ 4 = <b>${n.gluc} g</b></li>
      <li class="muted">Ces repères conviennent à un adulte en bonne santé. En cas de pathologie, demande l’avis d’un médecin ou d’un diététicien.</li>
    </ul></details>
    ${Pics.key||Pics.sharedCount()?"":`<div class="banner" style="margin-top:22px"><span class="small">Affiche les photos des plats avec une clé Unsplash gratuite.</span><button class="btn" style="padding:9px 14px" data-a="nav" data-v="profile">Ajouter</button></div>`}
    ${meals}
    <div class="total"><b>Total de cette journée : ${nf(sum.k)} kcal</b><div style="margin-top:6px">${macroLine(sum.p,sum.g,sum.l)}</div>
      <p class="small muted" style="margin-top:6px">Objectif : ${nf(n.kcal)} kcal, ${n.prot} g de protéines.</p></div>
    ${UI.day.length?`<button class="btn wide" style="margin-top:16px" data-a="addday">Ajouter cette journée à ma liste de courses</button>`:""}`;
}

function recipeList(){
  const p = S.profile, n = needs(p), F = UI.filt, q = norm(F.q);
  return RECIPES.filter(r=>allowed(r,p))
    .filter(r=>F.type==="all"||r.t.includes(F.type))
    .filter(r=>!F.time||r.m<=F.time)
    .filter(r=>!F.budget||r.b<=F.budget)
    .filter(r=>!F.fav||S.favs.includes(r.id))
    .filter(r=>!q||norm(r.n).includes(q)||r.i.some(([id])=>norm(ING[id][0]).includes(q)))
    .map(r=>({r, ...fit(r,n,F.type==="all"?r.t[0]:F.type)}))
    .sort((a,b)=>a.score-b.score);
}
const listHTML = list => list.length ? list.map(x=>card(x.r,x.f)).join("") : `<div class="empty">Aucune recette avec ces filtres. Retire un filtre ou change ta recherche.</div>`;
const countTxt = list => `${list.length} recette${list.length>1?"s":""}`;
function vRecipes(){

  const chip = (k,v,l) => `<button class="chip" data-a="filt" data-k="${k}" data-v="${v}" ${pressed(String(F[k])===String(v))}>${l}</button>`;

    <div class="scroller" style="margin-top:8px">${chip("budget",0,"Tout budget")}${chip("budget",1,"€")}${chip("budget",2,"€€ max")}<button class="chip" data-a="favf" ${pressed(F.fav)}>♥ Favoris</button></div>

/* ---- Produits ---- */
function pimg(pr){ return pr.img ? `<img class="pimg" src="${esc(pr.img)}" alt="" loading="lazy">` : `<span class="pimg none">◻︎</span>`; }
function prodCard(pr, action, extra){
  const full = [pr.k,pr.p,pr.g,pr.l].every(v=>v!==null);
  return `<button class="card" ${action}><div class="prow">${pimg(pr)}<div style="flex:1;min-width:0">
    <h3>${esc(pr.name)}</h3><p class="small muted">${esc([pr.brand,pr.qty].filter(Boolean).join(", "))}</p>
    <div class="meta" style="margin:6px 0 0">${full?`<span class="pill">${nf(pr.k)} kcal</span><span class="pill">P ${nf(pr.p,1)}</span><span class="pill">G ${nf(pr.g,1)}</span><span class="pill">L ${nf(pr.l,1)}</span>`:`<span class="pill">valeurs incomplètes</span>`}${pr.stores.map(s=>`<span class="pill">${badge(s)}${esc(s)}</span>`).join("")}</div>
    ${extra||""}</div></div></button>`;
}
function vProducts(){
  const P = UI.prod, mine = myStores();
  let res = P.results;
  if(res){
    res = [...res].sort((a,b)=>(b.stores.length>0)-(a.stores.length>0) || ([b.k,b.p].every(v=>v!==null))-([a.k,a.p].every(v=>v!==null)));
    if(P.mine) res = res.filter(x=>x.stores.length);
  }
  const body = P.loading ? `<p class="muted">Recherche en cours…</p>`
    : P.err ? `<p class="err">${P.err}</p>`
    : res===null ? ""
    : res.length ? `<p class="muted small" style="margin-bottom:10px">${res.length} produit${res.length>1?"s":""}, valeurs pour 100 g</p><div class="list">${res.map((x,i)=>prodCard(x,`data-a="pickres" data-i="${P.results.indexOf(x)}"`)).join("")}</div>`
    : `<div class="empty">Aucun produit trouvé${P.mine?" dans tes magasins. Désactive le filtre « Mes magasins »":". Essaie un terme plus simple, ou scanne le code-barres"}.</div>`;
  const pantry = S.pantry.length
    ? `<div class="list">${S.pantry.map(x=>prodCard(x,`data-a="editprod" data-id="${esc(x.id)}"`,`<p class="small" style="margin-top:6px">${x.link?`Remplace : ${ING[x.link][0]}`:`<span class="muted">Associé à aucun ingrédient</span>`}</p>`)).join("")}</div>`
    : `<div class="empty">Ton garde-manger est vide. Scanne ou cherche un produit que tu achètes, puis associe-le à un ingrédient : ses vraies valeurs seront utilisées dans les recettes.</div>`;
  return `<h1>Produits</h1><p class="muted lead">Trouve tes produits en rayon et utilise leurs vraies valeurs dans les recettes.</p>
    <div class="row"><button class="btn" data-a="scan">Scanner un code-barres</button><button class="btn ghost" data-a="newprod">Créer un produit</button></div>
    <form id="psearch" class="searchrow" style="margin-top:14px" role="search">
      <input type="search" data-f="q" data-scope="search" placeholder="ex. skyr, filet de poulet, riz basmati" value="${esc(P.q)}" aria-label="Rechercher un produit">
      <button class="btn" type="submit" ${P.loading?"disabled":""}>Chercher</button></form>
    ${P.target?`<div class="banner"><span class="small">Pour l’ingrédient : <b>${ING[P.target][0]}</b></span><button class="x" data-a="untarget" aria-label="Ne plus cibler cet ingrédient">✕</button></div>`:""}
    ${mine.length?`<div class="chips" style="margin-top:12px"><button class="chip" data-a="minef" ${pressed(P.mine)}>Seulement mes magasins</button></div>`:""}
    <div class="section" style="margin-top:18px">${body}</div>
    <div class="section"><h2>Mon garde-manger (${S.pantry.length})</h2>${pantry}</div>
    <p class="small muted" style="margin-top:20px">Données Open Food Facts, base collaborative sous licence ODbL. Les pastilles de magasins sont des repères visuels propres à l’app, sans lien avec les enseignes. Les magasins indiqués sont renseignés par les contributeurs et peuvent être incomplets.</p>`;
}

/* ---- Courses ---- */
function vList(){
  const ids = Object.keys(S.list).filter(id=>ING[id]);
  if(!ids.length) return `<h1>Courses</h1><p class="muted lead">Ta liste se remplit depuis les recettes.</p>
    <div class="empty">Ta liste est vide. Ajoute une recette depuis sa fiche, ou ta journée type depuis l’onglet Journée.</div>`;
  const order = [...myStores(), NO_STORE];
  const groups = {};
  ids.forEach(id=>{ const pr = linked(id); const st = (pr && pr.stores[0]) || NO_STORE; (groups[st] ||= []).push(id); });
  const keys = Object.keys(groups).sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
  const done = S.checked.filter(id=>S.list[id]).length;
  return `<h1>Courses</h1><p class="muted lead">${ids.length} article${ids.length>1?"s":""}, ${done} dans le panier.</p>
    ${keys.map(k=>`<div class="section" style="margin-top:22px"><h2 class="storehead">${k===NO_STORE?"":badge(k,"lg")}${esc(k)}</h2>${groups[k].sort((a,b)=>ING[a][0].localeCompare(ING[b][0],"fr")).map(id=>{
      const pr = linked(id), g = roundG(S.list[id]), on = S.checked.includes(id);
      return `<button class="check" data-a="check" data-id="${id}" ${pressed(on)}><span class="box">${on?"✓":""}</span>

    <button class="btn wide" style="margin-top:10px" data-a="sharelist">Partager la liste</button>`;
}
function listText(){
  const lines = ["Liste de courses (Assiette)"];
  Object.keys(S.list).filter(id=>ING[id] && !S.checked.includes(id)).forEach(id=>{
    const pr = linked(id);
    lines.push(`- ${pr?`${pr.name}${pr.brand?" ("+pr.brand+")":""}`:ING[id][0]} : ${roundG(S.list[id])} g${pr&&pr.stores[0]?`, ${pr.stores[0]}`:""}`);

  el.innerHTML = `<div class="sheet-in" role="dialog" aria-modal="true">${sh.kind==="recipe"?sRecipe(sh):sh.kind==="product"?sProduct(sh):sScan(sh)}</div>`;
}
function sRecipe(sh){
  const r = RECIPES[sh.id], f = sh.f, m = mac(r), n = needs(S.profile), fav = S.favs.includes(r.id);

}
function sScan(sh){

    <p id="scanmsg" class="small muted" style="margin-top:10px">${esc(sh.msg||"Vise le code-barres, bien éclairé, à 15 cm environ.")}</p>
    <div id="scanextra"></div>
    <form id="manualcode" class="searchrow" style="margin-top:14px">
      <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ou saisis le code (8 à 13 chiffres)" aria-label="Code-barres" id="codeinput">
      <button class="btn" type="submit">Chercher</button></form>`;
}

/* =========================================================
   8. SCAN DE CODE-BARRES
   BarcodeDetector (natif dans Chrome Android), sinon ZXing.
   ========================================================= */
const scan = {stream:null, timer:0, reader:null, busy:false};
function scanMsg(t, extra){ const m=$("#scanmsg"); if(m) m.textContent=t; const x=$("#scanextra"); if(x) x.innerHTML=extra||""; }
function loadZXing(){
  return new Promise((ok,ko)=>{
    if(window.ZXing) return ok();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = ()=>ok(); s.onerror = ()=>ko(new Error("zxing")); document.head.appendChild(s);
  });
}
async function startScan(){
  stopScan(); scan.busy = false;
  UI.sheet = {kind:"scan"}; renderSheet();
  const video = $("#scanvideo");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanMsg("Caméra indisponible ici. Saisis le code à la main."); return; }
  try{
    let formats = [];
    if("BarcodeDetector" in window){ try{ formats = (await BarcodeDetector.getSupportedFormats()).filter(f=>["ean_13","ean_8","upc_a","upc_e"].includes(f)); }catch(e){} }
    if(formats.length){
      const det = new BarcodeDetector({formats});
      scan.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      video.srcObject = scan.stream; await video.play();
      const loop = async ()=>{
        if(!scan.stream) return;
        try{ const c = await det.detect(video); if(c.length) return found(c[0].rawValue); }catch(e){}
        scan.timer = setTimeout(loop, 200);
      };
      loop();
    } else {
      await loadZXing();
      scan.reader = new ZXing.BrowserMultiFormatReader();
      scan.reader.decodeFromConstraints({video:{facingMode:"environment"}}, video, res=>{ if(res) found(res.getText()); });
    }
  }catch(e){
    scanMsg("Impossible d’ouvrir la caméra. Autorise l’accès dans Chrome (icône à gauche de l’adresse), ou saisis le code à la main.");
  }
}
function stopScan(){
  clearTimeout(scan.timer);
  if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream = null; }
  if(scan.reader){ try{ scan.reader.reset(); }catch(e){} scan.reader = null; }
}
async function found(code){
  code = String(code).replace(/\D/g,"");
  if(scan.busy || code.length<8) return;
  scan.busy = true; stopScan();
  if(navigator.vibrate) navigator.vibrate(60);
  scanMsg(`Code ${code} : recherche du produit…`);
  try{
    const pr = await ProductSource.barcode(code);
    if(!pr){
      scanMsg(`Le code ${code} n’est pas encore dans Open Food Facts.`, `<div class="row" style="margin-top:10px"><button class="btn" data-a="newprod" data-code="${code}">Le créer à la main</button><button class="btn ghost" data-a="scan">Scanner à nouveau</button></div>`);
      scan.busy = false; return;
    }
    openProduct(pr, false);
  }catch(e){
    scanMsg("Pas de connexion ou Open Food Facts ne répond pas. Réessaie dans un instant.", `<button class="btn ghost" style="margin-top:10px" data-a="scan">Réessayer</button>`);
    scan.busy = false;
  }
}

/* =========================================================
   9. ACTIONS
   ========================================================= */
function openProduct(pr, existing){
  const P = JSON.parse(JSON.stringify(pr));
  if(!existing){
    const same = P.code && S.pantry.find(x=>x.code===P.code);
    if(same){ UI.sheet = {kind:"product", p:JSON.parse(JSON.stringify(same)), existing:true}; renderSheet(); toast("Ce produit est déjà dans ton garde-manger."); return; }
    P.link = UI.prod.target || guessLink(P.name);
  }
  UI.sheet = {kind:"product", p:P, existing}; renderSheet();
}
async function doSearch(){
  const P = UI.prod, q = P.q.trim();
  if(!q) return;
  if(!navigator.onLine){ P.err = "Tu es hors ligne. La recherche de produits demande une connexion."; render(); return; }
  P.loading = true; P.err = ""; render();
  try{ P.results = await ProductSource.search(q); }
  catch(e){ P.results = null; P.err = "Open Food Facts ne répond pas. Réessaie dans un instant (10 recherches par minute maximum)."; }
  P.loading = false; render();
}
function saveProduct(){
  const sh = UI.sheet, P = sh.p;
  ["k","p","g","l"].forEach(f=>P[f] = r1(P[f]));
  if(!P.name.trim()){ sh.err = "Donne un nom au produit."; return renderSheet(); }
  if([P.k,P.p,P.g,P.l].some(v=>v===null || v<0)){ sh.err = "Renseigne les 4 valeurs pour 100 g, telles qu’écrites sur l’étiquette."; return renderSheet(); }
  if(P.p+P.g+P.l>100.5){ sh.err = "Protéines + glucides + lipides dépassent 100 g : vérifie les valeurs."; return renderSheet(); }
  if(!P.id) P.id = P.code || ("m"+Date.now());
  let moved = "";
  if(P.link) S.pantry.forEach(x=>{ if(x.id!==P.id && x.link===P.link){ x.link=""; moved = x.name; } });
  const i = S.pantry.findIndex(x=>x.id===P.id);
  i>=0 ? S.pantry[i] = P : S.pantry.unshift(P);
  persist(); UI.sheet = null; UI.prod.target = "";
  toast(moved ? `Enregistré. « ${moved} » n’est plus associé.` : sh.existing ? "Produit mis à jour." : "Ajouté au garde-manger.");
  render();
}
function addToList(id, f){
  RECIPES[id].i.forEach(([ing,g])=>{ S.list[ing] = (S.list[ing]||0) + g*f; S.checked = S.checked.filter(x=>x!==ing); });
}
function validate(d){
  if(!(d.age>=14&&d.age<=90)) return "Indique un âge entre 14 et 90 ans.";
  if(!(d.poids>=35&&d.poids<=250)) return "Indique un poids entre 35 et 250 kg.";
  if(!(d.taille>=130&&d.taille<=220)) return "Indique une taille entre 130 et 220 cm.";
  return "";
}
function closeSheet(){ stopScan(); UI.sheet = null; renderSheet(); }
function go(view){ UI.view = view; UI.err = ""; if(view==="profile") UI.draft = JSON.parse(JSON.stringify(S.profile)); render(); scrollTo(0,0); }

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]");
  if(!b){ if(e.target.id==="sheet") closeSheet(); return; }
  const a = b.dataset.a, D = UI.draft;
  switch(a){
    case "set": D[b.dataset.f] = b.dataset.v; render(); break;
    case "toggle": { const arr = D[b.dataset.f], v = b.dataset.v, i = arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); render(); break; }
    case "vege": D.vege = !D.vege; render(); break;
    case "next": if(UI.step===0){ UI.err = validate(D); if(UI.err) return render(); } UI.err=""; UI.step++; render(); scrollTo(0,0); break;
    case "prev": UI.err=""; UI.step--; render(); scrollTo(0,0); break;
    case "finish": S.profile = JSON.parse(JSON.stringify(D)); persist(); go("home"); break;
    case "nav": closeSheet(); go(b.dataset.v); break;
    case "saveProfile": UI.err = validate(D); if(UI.err) return render(); S.profile = JSON.parse(JSON.stringify(D));
      S.pantry.forEach(x=>{ x.stores = x.stores.filter(s=>myStores().includes(s)); }); persist(); toast("Profil enregistré."); go("home"); break;
    case "reset": if(confirm("Effacer ton profil, tes favoris, ton garde-manger et ta liste ?")){ S = sane(null); persist(); Photos.clear(); UI.draft = blankProfile(); UI.step = 0; UI.view = "onboard"; render(); } break;
    case "reroll": UI.offsets[b.dataset.t]++; render(); break;
    case "filt": UI.filt[b.dataset.k] = b.dataset.k==="type" ? b.dataset.v : Number(b.dataset.v); render(); break;
    case "favf": UI.filt.fav = !UI.filt.fav; render(); break;
    case "open": UI.sheet = {kind:"recipe", id:Number(b.dataset.id), f:Number(b.dataset.fac)}; renderSheet(); break;
    case "close": closeSheet(); break;
    case "portion": UI.sheet.f = Math.min(3, Math.max(0.25, UI.sheet.f + Number(b.dataset.d))); renderSheet(); break;
    case "fav": { const id = Number(b.dataset.id), i = S.favs.indexOf(id); i<0?S.favs.push(id):S.favs.splice(i,1); persist(); const y = scrollY; render(); scrollTo(0,y); break; }
    case "addrecipe": addToList(UI.sheet.id, UI.sheet.f); persist(); toast("Ingrédients ajoutés à ta liste de courses."); break;
    case "addday": UI.day.forEach(x=>addToList(x.id, x.f)); persist(); toast("Journée ajoutée à ta liste de courses."); break;
    case "findprod": { const id = b.dataset.id; closeSheet(); UI.prod.q = searchTerm(id); UI.prod.target = id; UI.prod.results = null; go("products"); doSearch(); break; }
    case "untarget": UI.prod.target = ""; render(); break;
    case "minef": UI.prod.mine = !UI.prod.mine; render(); break;
    case "scan": startScan(); break;
    case "newprod": stopScan(); openProduct({id:"",code:b.dataset.code||"",name:"",brand:"",qty:"",img:"",offStores:"",k:null,p:null,g:null,l:null,link:UI.prod.target||"",stores:[]}, false); break;
    case "pickres": openProduct(UI.prod.results[Number(b.dataset.i)], false); break;
    case "editprod": { const pr = S.pantry.find(x=>x.id===b.dataset.id); if(pr) openProduct(pr, true); break; }
    case "pstore": { const arr = UI.sheet.p.stores, v = b.dataset.v, i = arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); renderSheet(); break; }
    case "saveprod": saveProduct(); break;
    case "delprod": if(confirm("Retirer ce produit ? Les recettes reprendront les valeurs Ciqual.")){ S.pantry = S.pantry.filter(x=>x.id!==UI.sheet.p.id); persist(); UI.sheet = null; toast("Produit retiré."); render(); } break;
    case "check": { const id = b.dataset.id, i = S.checked.indexOf(id); i<0?S.checked.push(id):S.checked.splice(i,1); persist(); const y = scrollY; render(); scrollTo(0,y); break; }
    case "clearchecked": S.checked.forEach(id=>delete S.list[id]); S.checked = []; persist(); render(); break;
    case "clearlist": if(confirm("Vider toute la liste de courses ?")){ S.list = {}; S.checked = []; persist(); render(); } break;
    case "sharelist": { const t = listText();
      if(navigator.share) navigator.share({title:"Liste de courses", text:t}).catch(()=>{});
      else if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Liste copiée."), ()=>toast("Copie impossible."));
      break; }
    case "export": { const blob = new Blob([JSON.stringify({app:"assiette", version:2, date:new Date().toISOString(), data:S}, null, 2)], {type:"application/json"});
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = `assiette-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000); toast("Sauvegarde exportée."); break; }
    case "import": $("#importfile").click(); break;
    case "savekey": Pics.setKey($("#pkey").value); toast(Pics.key ? "Clé enregistrée." : "Clé supprimée."); render(); break;
    case "preload": Pics.blocked = false; Pics.err = ""; Pics.warm = true; RECIPES.forEach(r=>{ const p = Pics.get(r.id); if(p) [p.s,p.m].forEach(u=>fetch(u,{mode:"no-cors"}).catch(()=>{})); else Pics.want(r.id); }); Pics.pump(); toast("Préchargement lancé, garde l’app ouverte."); break;
    case "clearpics": if(confirm("Effacer tes photos locales ? Celles de photos.json restent affichées.")){ Pics.cache = {}; Pics.save(); Pics.blocked = false; Pics.err = ""; toast("Les photos vont se recharger."); render(); } break;
    case "exportpics": { const data = Pics.exportJSON(); const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = "photos.json";
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000);
      toast(`photos.json exporté : ${data.count} recettes.`); break; }
    case "nextpic": { const sid = UI.sheet.id; if(!Pics.cache[sid] && Pics.shared[sid]) Pics.cache[sid] = JSON.parse(JSON.stringify(Pics.shared[sid])); const c = Pics.cache[sid]; if(c){ c.i = (c.i+1) % c.list.length; Pics.save(); renderSheet(); refreshPic(UI.sheet.id); } break; }
    case "photo": UI.photoFor = UI.sheet.id; $(b.dataset.src==="cam"?"#photocam":"#photogal").click(); break;
    case "unphoto": if(confirm("Supprimer ta photo ?")){ const id = UI.sheet.id; Photos.del(id).then(()=>{ toast("Photo supprimée."); const y = scrollY; render(); scrollTo(0,y); }); } break;
  }
});
document.addEventListener("input", e=>{
  const t = e.target, f = t.dataset.f; if(!f) return;
  const scope = t.dataset.scope;
  if(scope==="filt"){ UI.filt.q = t.value; const list = recipeList(); $("#rlist").innerHTML = listHTML(list); $("#count").textContent = countTxt(list); return; }
  if(scope==="search"){ UI.prod.q = t.value; return; }
  if(scope==="prod"){ UI.sheet.p[f] = t.type==="number" ? (t.value===""?null:Number(t.value.replace(",","."))) : t.value; return; }
  UI.draft[f] = t.type==="number" ? Number(t.value.replace(",",".")) : t.value;
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="psearch") doSearch();
  if(e.target.id==="manualcode"){ scan.busy = false; found($("#codeinput").value); }
});
["#photocam","#photogal"].forEach(sel=>$(sel).addEventListener("change", async e=>{
  const file = e.target.files[0], id = UI.photoFor; e.target.value = "";
  if(!file || id===undefined) return;
  try{ toast("Enregistrement de la photo…"); await Photos.put(id, await resizeImage(file)); toast("Photo enregistrée."); const y = scrollY; render(); scrollTo(0,y); }
  catch(err){ toast("Impossible d’enregistrer cette photo."); }
}));
$("#importfile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const j = JSON.parse(rd.result), data = j && j.data ? j.data : j;
      if(!data || !data.profile) throw new Error("format");
      S = sane(data); persist(); UI.draft = JSON.parse(JSON.stringify(S.profile)); toast("Sauvegarde importée."); go("home");
    }catch(err){ toast("Ce fichier n’est pas une sauvegarde Assiette."); }
    e.target.value = "";
  };
  rd.readAsText(file);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && UI.sheet) closeSheet(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && UI.sheet && UI.sheet.kind==="scan") stopScan(); });

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
render();
Pics.loadShared().then(()=>{ if(Pics.sharedCount() && UI.view!=="onboard") render(); });
Photos.loadAll().then(()=>{ if(Object.keys(Photos.urls).length && UI.view!=="onboard") render(); });
</script>
