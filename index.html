<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Recettes adaptées à tes objectifs sportifs et à ton budget, avec les produits de tes magasins.">
<title>Assiette</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--soft:#fafafa;--fill:#f2f2f2;--line:#ebebeb;--line2:#dbdbdb;
  --text:#111111;--muted:#737373;--accent:#f2542d;--accent-soft:#fff1ec;--on-accent:#ffffff;
  --p:#2f80ed;--g:#f2a516;--l:#a259ff;--ok:#1f9d55;--warn:#e5484d;
  --r-sm:10px;--r-md:14px;--r-lg:22px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;flex:none;display:block}
main{max-width:640px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin:0 -16px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.topbar .brand{font-size:26px;font-weight:800;letter-spacing:-.03em}
.topbar .brand span{color:var(--accent)}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0 0 10px;line-height:1.2}
h3{font-size:16px;font-weight:700;margin:0;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.stack>*+*{margin-top:14px}
.section{margin-top:28px}
.lead{margin:14px 0 4px}

/* Besoins */
.hero-card{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.kcal{font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.kcal small{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.band{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:16px;gap:3px}
.band span{display:block;height:100%;border-radius:99px}
.bp{background:var(--p)}.bg{background:var(--g)}.bl{background:var(--l)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.legend b{display:block;font-size:19px;font-weight:800}
.legend span{font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}
details li{margin:4px 0}
.budgetbar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:10px}
.budgetbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.budgetbar.over span{background:var(--warn)}

/* Fil des repas */
.post{margin-top:24px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.post-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.post-head b{font-size:15px}
.photo{position:relative;display:block;width:calc(100% + 32px);margin:0 -16px;border:none;padding:0;background:var(--fill);aspect-ratio:4/3;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:700;background:linear-gradient(135deg,#f6f6f6,#ececec)}
.actions{display:flex;align-items:center;gap:4px;margin:6px -8px 0}
.actions button{border:none;background:none;padding:8px;border-radius:50%;display:flex}
.actions button.on{color:var(--accent)}
.actions .grow{flex:1}
.post-body{padding:2px 0 12px;width:100%;text-align:left;border:none;background:none}
.post-body h3{font-size:16.5px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font-size:12.5px;font-weight:700;background:var(--fill);border-radius:99px;padding:3px 10px;color:#333}
.pill.hl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:#e9f7ef;color:var(--ok)}
.pill.over{background:#fdecec;color:var(--warn)}
.macros{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;color:#333}
.macros i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.total{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:22px}

/* Grille recettes */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;border:none;background:none;padding:0;font-size:12px;font-weight:700}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--line2)}
.story[aria-pressed=true] .ring{background:linear-gradient(135deg,var(--accent),#ffb03a)}
.ring>span{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;overflow:hidden;background:var(--fill)}
.ring img{width:100%;height:100%;object-fit:cover;display:block}
.ring .ini{display:flex;align-items:center;justify-content:center;height:100%;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:block;width:100%;aspect-ratio:1/1.12;border:none;padding:0;border-radius:var(--r-md);overflow:hidden;background:var(--fill);text-align:left}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.tile .ov h3{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ov p{font-size:12px;opacity:.92;margin-top:3px;font-weight:500}
.tile .tag{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.94);color:#111;border-radius:99px;padding:2px 8px}
.tile .tag.over{color:var(--warn)}
.tile .fav{position:absolute;top:6px;right:8px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

/* Formulaires */
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
input[type=number],input[type=text],input[type=search],input[type=password],textarea,select{width:100%;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#a8a8a8;background:#fff}
textarea{min-height:70px;resize:vertical}
.search{border-radius:99px !important;padding-left:16px !important;background:var(--fill) !important;border-color:transparent !important}
.seg{display:flex;background:var(--fill);border-radius:var(--r-sm);padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.opts>*+*{margin-top:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line2);border-radius:var(--r-md);padding:12px 14px}
.opt[aria-pressed=true]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.opt b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#fff}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{white-space:nowrap;flex:none}
.btn{border:none;border-radius:var(--r-sm);padding:13px 18px;font-weight:800;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--text)}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.link{background:none;border:none;color:var(--accent);font-weight:800;padding:6px 0}
.err{color:var(--warn);font-weight:700}
.steps{display:flex;gap:5px;margin:18px 0 22px}
.steps span{flex:1;height:4px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--text)}
.empty{background:var(--soft);border:1px dashed var(--line2);border-radius:var(--r-md);padding:16px;color:#444}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:16px}
.x{border:none;background:var(--fill);border-radius:50%;width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}

/* Magasins */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.store{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--line2);background:#fff;border-radius:var(--r-md);padding:14px 6px 10px;font-weight:700;font-size:13.5px}
.store[aria-pressed=true]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.store .chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;display:none;align-items:center;justify-content:center}
.store[aria-pressed=true] .chk{display:flex}
.logo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);overflow:hidden;flex:none}
.logo img{width:78%;height:78%;object-fit:contain}
.logo.sm{width:22px;height:22px;border-radius:6px}
.logo.md{width:34px;height:34px;border-radius:9px}
.sb{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--sb);color:#111;font-weight:800;font-size:13px;letter-spacing:.02em}
.logo.sm .sb{font-size:8px}.logo.md .sb{font-size:10px}
.storehead{display:flex;align-items:center;gap:10px}
.spill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:var(--fill);border-radius:99px;padding:2px 9px 2px 3px}

/* Produits */
.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.prow{display:flex;gap:12px;align-items:center}
.pimg{width:60px;height:60px;border-radius:var(--r-sm);object-fit:contain;background:var(--soft);border:1px solid var(--line);flex:none}
.pimg.none{display:flex;align-items:center;justify-content:center;color:#bbb}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1}
.list>*+*{margin-top:10px}
.price{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.price .pt{flex:1;min-width:0}
.price b{font-size:16px}
.price.mine{background:linear-gradient(90deg,var(--accent-soft),transparent);margin:0 -10px;padding:10px;border-radius:var(--r-sm)}

/* Courses */
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 0}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.check[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed=true] .ct{text-decoration:line-through;color:var(--muted)}
.check .ct{flex:1}
.check .q{text-align:right;white-space:nowrap}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs[hidden]{display:none}
nav.tabs button{flex:1;max-width:120px;border:none;background:none;padding:6px 2px;color:#8a8a8a;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current=page]{color:var(--text)}
nav.tabs svg.i{width:25px;height:25px}

/* Fiches */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet[hidden]{display:none}
.sheet-in{background:#fff;width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet-pad{padding-top:18px}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero{position:relative;margin:0 -18px;aspect-ratio:16/10;background:var(--fill);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .x{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.credit{font-size:11.5px;color:var(--muted);margin-top:6px}
.credit a{color:var(--muted)}
.photo-actions{display:flex;flex-wrap:wrap;gap:0 16px}
.stepper{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-top:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:#fff;font-size:20px;font-weight:700}
.stepper div{flex:1}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing li .n{flex:1}
.ing li .q{white-space:nowrap;text-align:right}
.ing .link{padding:0;font-size:13.5px}
ol.how{padding-left:22px;margin:0}
ol.how li{margin:8px 0}
.video{position:relative;border-radius:var(--r-md);overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:14px}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;font-weight:700;padding:10px 16px;border-radius:99px;z-index:30;max-width:90%;text-align:center;font-size:14px}
.toast[hidden]{display:none}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="photocam" accept="image/*" capture="environment" hidden>
<input type="file" id="photogal" accept="image/*" hidden>

const FIELDS = "code,product_name,product_name_fr,brands,quantity,product_quantity,product_quantity_unit,stores,image_front_small_url,image_small_url,nutriments";
const r1 = v => (v===null || v===undefined || v==="" || isNaN(v)) ? null : Math.round(Number(v)*10)/10;
function fromOFF(p){
  const n = p.nutriments || {};
  let k = n["energy-kcal_100g"];
  if((k===undefined || k===null) && n.energy_100g!=null) k = n.energy_100g/4.184;
  const unit = (p.product_quantity_unit||"g").toLowerCase();
  const pr = {
    id:"", code:p.code||"", name:(p.product_name_fr||p.product_name||"").trim()||"Produit sans nom",
    brand:(p.brands||"").split(",")[0].trim(), qty:p.quantity||"",
    img:p.image_front_small_url||p.image_small_url||"", offStores:p.stores||"",
    k:r1(k), p:r1(n.proteins_100g), g:r1(n.carbohydrates_100g), l:r1(n.fat_100g),
    price:null, weight:(["g","ml"].includes(unit) && Number(p.product_quantity)>0) ? Math.round(Number(p.product_quantity)) : null,
    link:"", stores:[]
  };
  pr.stores = myStores().filter(s=>storeMatch(pr.offStores, s));
  return pr;
}
/* Requête avec délai maximal, pour ne jamais rester bloqué sur un service lent */
async function fetchT(url, opts={}, ms=12000){
  const c = new AbortController(), t = setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); } finally{ clearTimeout(t); }
}
/* Les champs du nouveau moteur peuvent être du texte, une liste ou un objet par langue */
const pickTxt = v => v==null ? "" : Array.isArray(v) ? v.filter(Boolean).join(", ") : typeof v==="object" ? String(v.fr||v.main||v.en||Object.values(v)[0]||"") : String(v);
const ProductSource = {
  /* 1) Search-a-licious (nouveau moteur), 2) ancienne recherche en secours */
  async search(term){
    const clean = term.replace(/[+\-!(){}\[\]^"~*?:\\/&|]/g," ").replace(/\s+/g," ").trim();
    if(!clean) return [];
    try{
      const qs = new URLSearchParams({q:`(${clean}) AND countries_tags:"en:france"`, langs:"fr", page_size:40, fields:FIELDS});
      const r = await fetchT(`https://search.openfoodfacts.org/search?${qs}`);
      if(r.ok){
        const j = await r.json();
        const hits = (j.hits||[]).filter(h=>h && h.code).map(h=>fromOFF({
          code:h.code, product_name_fr:pickTxt(h.product_name_fr), product_name:pickTxt(h.product_name), brands:pickTxt(h.brands),
          quantity:pickTxt(h.quantity), product_quantity:h.product_quantity, product_quantity_unit:pickTxt(h.product_quantity_unit),
          stores:pickTxt(h.stores)||pickTxt(h.stores_tags), image_front_small_url:pickTxt(h.image_front_small_url), image_small_url:pickTxt(h.image_small_url),
          nutriments:h.nutriments||{}}));
        if(hits.length) return hits;
      }
    }catch(e){}
    const qs = new URLSearchParams({search_terms:clean, search_simple:1, action:"process", json:1, page_size:40,
      tagtype_0:"countries", tag_contains_0:"contains", tag_0:"france", fields:FIELDS});
    const r = await fetchT(`${OFF}/cgi/search.pl?${qs}`, {}, 20000);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return (j.products||[]).map(fromOFF);
  },
  async barcode(code){
    const r = await fetchT(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${FIELDS}`);
    if(r.status===404) return null;
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return j.status===1 && j.product ? fromOFF({...j.product, code}) : null;
  },
  /* Prix réels relevés par les consommateurs, avec le magasin précis */
  async prices(code){
    const qs = new URLSearchParams({product_code:code, order_by:"-date", size:50});
    const r = await fetchT(`https://prices.openfoodfacts.org/api/v1/prices?${qs}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    return (j.items||[]).filter(x=>(x.currency||"EUR")==="EUR" && x.price>0).map(x=>{
      const loc = x.location||{}, prod = x.product||{};
      const unit = (prod.product_quantity_unit||"g").toLowerCase(), q = Number(prod.product_quantity)||0;
      const ppk = x.price_per==="KILOGRAM" ? x.price : (q>0 && ["g","ml"].includes(unit) ? x.price/(q/1000) : null);
      const label = [loc.osm_brand, loc.osm_name].filter(Boolean).join(" ").trim();
      return {price:x.price, per:x.price_per, ppk, weight:x.price_per==="KILOGRAM"?1000:(q||null), date:x.date,
        brand:loc.osm_brand||"", name:loc.osm_name||"", city:loc.osm_address_city||"", logo:loc.osm_brand_logo_url||"",
        store:myStores().find(s=>storeMatch(label, s))||""};
    });
  }
};

const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.\-]/g," ").replace(/\s+/g," ").trim();
function myStores(){ const p = S.profile || UI.draft; return [...(p.magasins||[]), ...(p.autreMagasin?[p.autreMagasin.trim()]:[])].filter(Boolean); }
function storeMatch(text, store){ const t = " "+norm(text)+" "; const al = STORE_INFO[store] ? STORE_INFO[store].a : [norm(store)]; return al.some(a=>t.includes(a)); }
const linked = id => S.pantry.find(x=>x.link===id);
function ingVals(id){ const x = ING[id], pr = linked(id); return pr ? [x[0], pr.k, pr.p, pr.g, pr.l, x[5]] : x; }
function ingPrice(id){ const pr = linked(id); return (pr && pr.price>0 && pr.weight>0) ? pr.price/pr.weight*1000 : PRICE[id]; }
function mac(r){
  let k=0,p=0,g=0,l=0;
  for(const [id,q] of r.i){ const x = ingVals(id); k+=x[1]*q/100; p+=x[2]*q/100; g+=x[3]*q/100; l+=x[4]*q/100; }
  return {k,p,g,l};
}
const cost = r => r.i.reduce((t,[id,q])=>t+ingPrice(id)*q/1000, 0);
RECIPES.forEach((r,idx)=>{ r.id = idx; });

function needs(p){
  const bmr = 10*p.poids + 6.25*p.taille - 5*p.age + (p.sexe==="h" ? 5 : -161);
  const a = ACT[p.activite], g = GOALS[p.objectif];
  const tdee = bmr*a.f;
  const kcal = Math.round(tdee*g.k/10)*10;
  const prot = Math.round(g.p*p.poids);
  const lip = Math.round(g.lip*p.poids);
  const gluc = Math.max(50, Math.round((kcal - prot*4 - lip*9)/4));
  const b = Number(p.budget)>0 ? Number(p.budget)/Math.max(1, Number(p.personnes)||1)/30.4 : 0;
  return {bmr, tdee, kcal, prot, lip, gluc, a, g, day:b};
}
function allowed(r, p){
  const ex = new Set(p.exclus);
  if(p.vege) MEAT.forEach(t=>ex.add(t));
  const avoid = (p.eviter||"").split(/[,;\n]/).map(norm).filter(w=>w.length>2);
  return r.i.every(([id])=>{
    const tags = ING[id][5].split(" ").filter(Boolean);
    if(tags.some(t=>ex.has(t))) return false;
    const name = norm(ING[id][0]);
    return !avoid.some(w=>name.includes(w));
  });
}
function fit(r, n, type){
  const m = mac(r), target = n.kcal*MEALS[type].s;
  let f = Math.round((target/m.k)*4)/4;
  f = Math.min(2.5, Math.max(0.5, f));
  const tP = n.prot*4/n.kcal, tG = n.gluc*4/n.kcal;
  const pS = m.p*4/m.k, gS = m.g*4/m.k;
  const c = cost(r)*f, cap = n.day ? n.day*MEALS[type].c : 0;
  let score = Math.abs(pS-tP)*2 + Math.abs(gS-tG) + Math.abs(target/(m.k*f)-1)*1.5;
  if(cap && c>cap) score += (c/cap-1)*1.5;
  return {f, score, m, c, cap, over: cap>0 && c>cap*1.05};
}
function ranked(type, n, p, exclude){
  return RECIPES.filter(r=>r.t.includes(type) && allowed(r,p) && r.id!==exclude)
    .map(r=>({r, ...fit(r,n,type)})).sort((a,b)=>a.score-b.score);
}
function guessLink(name){
  const n = " "+norm(name)+" ";
  let best = "", bs = 0;
  for(const [id,x] of Object.entries(ING)){
    const words = norm(x[0].replace(/\(.*?\)/g,"")).split(/[^a-z0-9œ]+/).filter(w=>w.length>3);
    if(!words.length) continue;
    const s = words.filter(w=>n.includes(w)).length/words.length;
    if(s>bs){ bs=s; best=id; }
  }
  return bs>=0.5 ? best : "";
}

const Pics = {
  key:(()=>{ try{ return localStorage.getItem("assiette.unsplash")||""; }catch(e){ return ""; } })(),
  cache:(()=>{ try{ return JSON.parse(localStorage.getItem("assiette.pics")||"{}"); }catch(e){ return {}; } })(),
  shared:{}, queue:[], busy:0, pending:new Set(), blocked:false, err:"", warm:false,
  async loadShared(){
    try{ const r = await fetch("photos.json", {cache:"no-cache"}); if(!r.ok) return; const j = await r.json(); if(j && j.photos) this.shared = j.photos; }catch(e){}
  },
  entry(id){ return this.cache[id] || this.shared[id]; },
  save(){ try{ localStorage.setItem("assiette.pics", JSON.stringify(this.cache)); }catch(e){} },
  setKey(k){ this.key = k.trim(); this.blocked = false; this.err = ""; try{ this.key ? localStorage.setItem("assiette.unsplash", this.key) : localStorage.removeItem("assiette.unsplash"); }catch(e){} },
  count(){ return RECIPES.filter(r=>{ const c = this.entry(r.id); return c && c.list.length; }).length; },
  sharedCount(){ return Object.values(this.shared).filter(c=>c && c.list && c.list.length).length; },
  get(id){ const c = this.entry(id); return c && c.list.length ? c.list[c.i % c.list.length] : null; },
  exportJSON(){
    const photos = {};
    RECIPES.forEach(r=>{ const c = this.entry(r.id); if(c && c.list.length) photos[r.id] = {i:c.i % c.list.length, list:c.list}; });
    return {app:"assiette", source:"unsplash", date:new Date().toISOString(), count:Object.keys(photos).length, photos};
  },
  want(id){ if(!this.key || this.blocked || this.entry(id) || this.pending.has(id) || !navigator.onLine) return; this.pending.add(id); this.queue.push(id); this.pump(); },
  pump(){
    while(this.busy<2 && this.queue.length){ const id = this.queue.shift(); this.busy++; this.fetch(id).finally(()=>{ this.busy--; this.pending.delete(id); this.pump(); }); }
    if(!this.busy && !this.queue.length && this.warm){ this.warm = false; toast(this.blocked ? this.err : `Photos prêtes : ${this.count()} sur ${RECIPES.length}.`); if(UI.view==="profile") render(); }
  },
  async fetch(id){
    try{
      const r = await fetch(`https://api.unsplash.com/search/photos?${new URLSearchParams({query:PHOTO_Q[id], per_page:8, orientation:"landscape", content_filter:"high"})}`, {headers:{Authorization:"Client-ID "+this.key, "Accept-Version":"v1"}});
      if(r.status===401){ this.blocked = true; this.err = "Clé Unsplash refusée : vérifie la clé d’accès (Access Key) dans Profil."; this.queue = []; return; }
      if(r.status===403 || r.status===429){ this.blocked = true; this.err = "Limite Unsplash atteinte (50 recettes par heure). Relance « Précharger tout » dans une heure pour la suite."; this.queue = []; return; }
      if(!r.ok) return;
      const j = await r.json(), utm = "utm_source=assiette&utm_medium=referral";
      const sz = (raw,w,h)=>`${raw}${raw.includes("?")?"&":"?"}w=${w}&h=${h}&fit=crop&auto=format&q=70`;
      this.cache[id] = {i:0, list:(j.results||[]).map(p=>({s:sz(p.urls.raw,260,260), m:sz(p.urls.raw,800,380), l:sz(p.urls.raw,1080,560),
        ph:p.user.name, pu:`${p.user.links.html}?${utm}`, u:`https://unsplash.com/?${utm}`, c:p.color}))};
      this.save(); refreshPic(id);
      if(UI.sheet && UI.sheet.kind==="recipe" && UI.sheet.id===id) renderSheet();
      if(this.warm){ const p = this.get(id); if(p) [p.s,p.m].forEach(u=>fetch(u,{mode:"no-cors"}).catch(()=>{})); }
    }catch(e){}
  }
};

const Photos = {
  db:null, urls:{},
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((ok,ko)=>{ const q = indexedDB.open("assiette-photos",1);
      q.onupgradeneeded = ()=>q.result.createObjectStore("photos");
      q.onsuccess = ()=>{ this.db = q.result; ok(this.db); }; q.onerror = ()=>ko(q.error); });
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((ok,ko)=>{ const t = db.transaction("photos",mode); fn(t.objectStore("photos")); t.oncomplete = ()=>ok(); t.onerror = ()=>ko(t.error); t.onabort = ()=>ko(t.error); });
  },
  async loadAll(){
    try{ await this.run("readonly", st=>{ const c = st.openCursor(); c.onsuccess = ()=>{ const cur = c.result; if(cur){ this.urls[cur.key] = URL.createObjectURL(cur.value); cur.continue(); } }; }); }catch(e){}
  },
  async put(id, blob){ await this.run("readwrite", st=>st.put(blob,id)); if(this.urls[id]) URL.revokeObjectURL(this.urls[id]); this.urls[id] = URL.createObjectURL(blob); },
  async del(id){ await this.run("readwrite", st=>st.delete(id)); if(this.urls[id]){ URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; } },
  async clear(){ try{ await this.run("readwrite", st=>st.clear()); }catch(e){} Object.values(this.urls).forEach(u=>URL.revokeObjectURL(u)); this.urls = {}; }
};
async function resizeImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){ bmp = await createImageBitmap(file); }
  const max = 1000, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error("jpeg")),"image/jpeg",.82));
}
function picURL(r, size="s"){
  const own = Photos.urls[r.id]; if(own) return own;
  const p = Pics.get(r.id); if(p) return p[size]||p.m;
  Pics.want(r.id); return "";
}
function visual(r, size="s"){
  const u = picURL(r, size);
  if(u) return `<img src="${esc(u)}" alt="${esc(r.n)}" loading="lazy"${!Photos.urls[r.id]&&Pics.get(r.id)?` style="background:${esc(Pics.get(r.id).c||"transparent")}"`:""}>`;
  return `<span class="ph-empty">${MEALS[r.t[0]].l}</span>`;
}

    return `<button class="story" data-a="filt" data-k="type" data-v="${k}" ${pressed(F.type===k)}><span class="ring"><span>${img||`<span class="ini">${ini}</span>`}</span></span>${l}</button>`;

  return `${topbar(`<h1>Recettes</h1>`)}

}

/* ---- Produits ---- */
function pimg(pr){ return pr.img ? `<img class="pimg" src="${esc(pr.img)}" alt="" loading="lazy">` : `<span class="pimg none">${icon("bag")}</span>`; }
const spill = s => `<span class="spill">${logo(s,"sm")}${esc(s)}</span>`;
function prodCard(pr, action, extra){
  const full = [pr.k,pr.p,pr.g,pr.l].every(v=>v!==null);
  const ppk = pr.price>0 && pr.weight>0 ? pr.price/pr.weight*1000 : 0;
  return `<button class="card" ${action}><div class="prow">${pimg(pr)}<div style="flex:1;min-width:0">
    <h3 style="font-size:15px">${esc(pr.name)}</h3><p class="small muted">${esc([pr.brand,pr.qty].filter(Boolean).join(", "))}</p>
    <div class="meta" style="margin:6px 0 0">${full?`<span class="pill">${nf(pr.k)} kcal</span><span class="pill">P ${nf(pr.p,1)}</span><span class="pill">G ${nf(pr.g,1)}</span><span class="pill">L ${nf(pr.l,1)}</span>`:`<span class="pill over">valeurs incomplètes</span>`}${ppk?`<span class="pill ok">${eur(ppk)}/kg</span>`:""}</div>
    ${pr.stores.length?`<div class="meta" style="margin:6px 0 0">${pr.stores.map(spill).join("")}</div>`:""}
    ${extra||""}</div></div></button>`;
}
function vProducts(){
  const P = UI.prod, mine = myStores();

    res = [...res].sort((a,b)=>(b.stores.length>0)-(a.stores.length>0) || ([b.k,b.p].every(v=>v!==null))-([a.k,a.p].every(v=>v!==null)));
    if(P.mine) res = res.filter(x=>x.stores.length);

  const body = P.loading ? `<p class="muted">Recherche en cours…</p>`

    : `<div class="empty">Aucun produit trouvé${P.mine?" dans tes magasins. Désactive le filtre « Mes magasins »":". Essaie un terme plus simple, ou scanne le code-barres"}.</div>`;
  const pantry = S.pantry.length
    ? `<div class="list">${S.pantry.map(x=>prodCard(x,`data-a="editprod" data-id="${esc(x.id)}"`,`<p class="small" style="margin-top:6px">${x.link?`Remplace : <b>${ING[x.link][0]}</b>`:`<span class="muted">Associé à aucun ingrédient</span>`}</p>`)).join("")}</div>`
    : `<div class="empty">Ton garde-manger est vide. Scanne ou cherche un produit que tu achètes, puis associe-le à un ingrédient : ses vraies valeurs et son prix seront utilisés dans les recettes.</div>`;
  return `${topbar(`<h1>Produits</h1>`)}
    <div class="row" style="margin-top:14px"><button class="btn dark" data-a="scan">${icon("scan")}Scanner</button><button class="btn ghost" data-a="newprod">Créer un produit</button></div>
    <form id="psearch" class="searchrow" style="margin-top:12px" role="search">
      <input type="search" class="search" data-f="q" data-scope="search" placeholder="ex. skyr, filet de poulet, riz basmati" value="${esc(P.q)}" aria-label="Rechercher un produit">
      <button class="btn" type="submit" ${P.loading?"disabled":""}>Chercher</button></form>
    ${P.target?`<div class="banner"><span class="small">Pour l’ingrédient : <b>${ING[P.target][0]}</b></span><button class="x" data-a="untarget" aria-label="Ne plus cibler cet ingrédient">${icon("x")}</button></div>`:""}
    ${mine.length?`<div class="scroller" style="margin-top:12px"><button class="chip" data-a="minef" ${pressed(P.mine)}>Seulement mes magasins</button>${mine.map(s=>`<span class="spill" style="flex:none">${logo(s,"sm")}${esc(s)}</span>`).join("")}</div>`:""}
    <div class="section" style="margin-top:18px">${body}</div>
    <div class="section"><h2>Mon garde-manger (${S.pantry.length})</h2>${pantry}</div>
    <p class="small muted" style="margin-top:20px">Produits : Open Food Facts. Prix : Open Prices, relevés par des consommateurs. Bases collaboratives sous licence ODbL : la couverture varie selon les magasins. Les icônes d’enseignes viennent de leurs sites et appartiennent à leurs propriétaires.</p>`;
}

function vList(){
  const ids = Object.keys(S.list).filter(id=>ING[id]);
  if(!ids.length) return `${topbar(`<h1>Courses</h1>`)}<p class="muted lead">Ta liste se remplit depuis les recettes.</p>
    <div class="empty">Ta liste est vide. Touche ${icon("cartplus").replace('class="i"','class="i" style="display:inline;width:18px;height:18px;vertical-align:-4px"')} sur un repas ou dans une recette.</div>`;
  const order = [...myStores(), NO_STORE];
  const groups = {};
  ids.forEach(id=>{ const pr = linked(id); const st = (pr && pr.stores[0]) || NO_STORE; (groups[st] ||= []).push(id); });
  const keys = Object.keys(groups).sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
  const done = S.checked.filter(id=>S.list[id]).length;

    ${keys.map(k=>`<div class="section" style="margin-top:20px"><h2 class="storehead">${k===NO_STORE?"":logo(k,"md")}${esc(k)}</h2>${groups[k].sort((a,b)=>ING[a][0].localeCompare(ING[b][0],"fr")).map(id=>{
      const pr = linked(id), g = roundG(S.list[id]), on = S.checked.includes(id);

        <span class="ct">${pr?`${esc(pr.name)}${pr.brand?` <span class="muted small">${esc(pr.brand)}</span>`:""}<br><span class="small muted">${ING[id][0]}</span>`:ING[id][0]}${unitHint(id,S.list[id])}</span>
        <span class="q"><b>${nf(g)} g</b><br><span class="small muted">≈ ${eur(ingPrice(id)*S.list[id]/1000)}</span></span></button>`;

    <div class="row" style="margin-top:24px"><button class="btn ghost" data-a="clearchecked" ${done?"":"disabled"}>Retirer les cochés</button><button class="btn ghost" data-a="clearlist">Vider la liste</button></div>
    <button class="btn wide dark" style="margin-top:10px" data-a="sharelist">Partager la liste</button>`;
}
function listText(){
  const lines = ["Liste de courses (Assiette)"];

  return lines.join("\n");
}

}
function sRecipe(sh){
  const r = RECIPES[sh.id], f = sh.f, m = mac(r), n = needs(S.profile), fav = S.favs.includes(r.id);

function sPrices(sh){

  else if(st.err) body = `<p class="small err">${st.err}</p>`;
  else {
    const mine = st.items.filter(x=>x.store), others = st.items.filter(x=>!x.store);
    const row = x => `<div class="price ${x.store?"mine":""}">${x.store?logo(x.store,"md"):(x.logo?`<span class="logo md"><img src="${esc(x.logo)}" alt="" loading="lazy"></span>`:`<span class="logo md">${badgeHTML(x.brand||x.name||"?")}</span>`)}
      <div class="pt"><b>${eur(x.price)}</b>${x.ppk&&x.per!=="KILOGRAM"?` <span class="small muted">(${eur(x.ppk)}/kg)</span>`:x.per==="KILOGRAM"?` <span class="small muted">le kg</span>`:""}<br>
        <span class="small">${esc([x.brand,x.name].filter(Boolean).join(" ").replace(/^(.+) \1/,"$1")||"Magasin")}${x.city?`, ${esc(x.city)}`:""}</span><br><span class="small muted">relevé le ${new Date(x.date).toLocaleDateString("fr-FR")}</span></div>

}
function sScan(sh){
  return `<div class="sheet-pad"><div class="sheet-top"><h2 style="font-size:22px;margin:0">Scanner un produit</h2><button class="x" data-a="close" aria-label="Fermer">${icon("x")}</button></div>
    <div class="video"><video id="scanvideo" playsinline muted></video></div>
    <p id="scanmsg" class="small muted" style="margin-top:10px">${esc(sh.msg||"Vise le code-barres, bien éclairé, à 15 cm environ.")}</p>
    <div id="scanextra"></div>
    <form id="manualcode" class="searchrow" style="margin-top:14px">
      <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ou saisis le code (8 à 13 chiffres)" aria-label="Code-barres" id="codeinput">
      <button class="btn" type="submit">Chercher</button></form></div>`;
}
/* =========================================================
   9. SCAN DE CODE-BARRES
   BarcodeDetector (natif dans Chrome Android), sinon ZXing.
   ========================================================= */
const scan = {stream:null, timer:0, reader:null, busy:false};
function scanMsg(t, extra){ const m=$("#scanmsg"); if(m) m.textContent=t; const x=$("#scanextra"); if(x) x.innerHTML=extra||""; }
function loadZXing(){
  return new Promise((ok,ko)=>{
    if(window.ZXing) return ok();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = ()=>ok(); s.onerror = ()=>ko(new Error("zxing")); document.head.appendChild(s);
  });
}
async function startScan(){
  stopScan(); scan.busy = false;
  UI.sheet = {kind:"scan"}; renderSheet();
  const video = $("#scanvideo");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanMsg("Caméra indisponible ici. Saisis le code à la main."); return; }
  try{
    let formats = [];
    if("BarcodeDetector" in window){ try{ formats = (await BarcodeDetector.getSupportedFormats()).filter(f=>["ean_13","ean_8","upc_a","upc_e"].includes(f)); }catch(e){} }
    if(formats.length){
      const det = new BarcodeDetector({formats});
      scan.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      video.srcObject = scan.stream; await video.play();
      const loop = async ()=>{
        if(!scan.stream) return;
        try{ const c = await det.detect(video); if(c.length) return found(c[0].rawValue); }catch(e){}
        scan.timer = setTimeout(loop, 200);
      };
      loop();
    } else {
      await loadZXing();
      scan.reader = new ZXing.BrowserMultiFormatReader();
      scan.reader.decodeFromConstraints({video:{facingMode:"environment"}}, video, res=>{ if(res) found(res.getText()); });
    }
  }catch(e){
    scanMsg("Impossible d’ouvrir la caméra. Autorise l’accès dans Chrome (icône à gauche de l’adresse), ou saisis le code à la main.");
  }
}
function stopScan(){
  clearTimeout(scan.timer);
  if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream = null; }
  if(scan.reader){ try{ scan.reader.reset(); }catch(e){} scan.reader = null; }
}
async function found(code){
  code = String(code).replace(/\D/g,"");
  if(scan.busy || code.length<8) return;
  scan.busy = true; stopScan();
  if(navigator.vibrate) navigator.vibrate(60);
  scanMsg(`Code ${code} : recherche du produit…`);
  try{
    const pr = await ProductSource.barcode(code);
    if(!pr){
      scanMsg(`Le code ${code} n’est pas encore dans Open Food Facts.`, `<div class="row" style="margin-top:10px"><button class="btn" data-a="newprod" data-code="${code}">Le créer à la main</button><button class="btn ghost" data-a="scan">Scanner à nouveau</button></div>`);
      scan.busy = false; return;
    }
    openProduct(pr, false);
  }catch(e){
    scanMsg("Pas de connexion ou Open Food Facts ne répond pas. Réessaie dans un instant.", `<button class="btn ghost" style="margin-top:10px" data-a="scan">Réessayer</button>`);
    scan.busy = false;
  }
}


/* =========================================================
   10. ACTIONS
   ========================================================= */
function openProduct(pr, existing){
  const P = JSON.parse(JSON.stringify(pr));
  if(!existing){
    const same = P.code && S.pantry.find(x=>x.code===P.code);
    if(same) return openProduct(same, true), toast("Ce produit est déjà dans ton garde-manger.");
    P.link = UI.prod.target || guessLink(P.name);
  }
  const sh = {kind:"product", p:P, existing, prices:P.code?{loading:true}:null};
  UI.sheet = sh; renderSheet();
  if(P.code){
    ProductSource.prices(P.code).then(items=>{
      items.sort((a,b)=>(!!b.store-!!a.store) || String(b.date).localeCompare(String(a.date)));
      sh.prices = {items};
    }).catch(()=>{ sh.prices = {err:"Prix indisponibles pour le moment (pas de connexion ou service Open Prices injoignable)."}; })
      .finally(()=>{ const box = $("#pricebox"); if(UI.sheet===sh && box) box.innerHTML = sPrices(sh); });
  }
}
/* Complète un résultat de recherche avec la fiche produit complète (photo, valeurs) */
function enrich(sh){
  if(!sh || sh.kind!=="product" || !sh.p.code) return;
  const P = sh.p;
  if(P.img && [P.k,P.p,P.g,P.l].every(v=>v!==null) && P.weight) return;
  ProductSource.barcode(P.code).then(full=>{
    if(!full || UI.sheet!==sh) return;
    ["img","brand","qty","offStores","k","p","g","l","weight"].forEach(f=>{ if((P[f]===null || P[f]==="") && full[f]!==null && full[f]!=="") P[f] = full[f]; });
    if(!P.stores.length) P.stores = full.stores;
    renderSheet();
  }).catch(()=>{});
}
async function doSearch(){
  const P = UI.prod, q = P.q.trim();
  if(!q) return;
  if(!navigator.onLine){ P.err = "Tu es hors ligne. La recherche de produits demande une connexion."; render(); return; }
  P.loading = true; P.err = ""; render();
  try{ P.results = await ProductSource.search(q); }
  catch(e){ P.results = null; P.err = e && e.name==="AbortError"
    ? "Open Food Facts met trop de temps à répondre. Réessaie dans un instant, ou scanne directement le code-barres : le scan passe par un service plus rapide."
    : "Open Food Facts ne répond pas pour le moment. Réessaie dans un instant, ou scanne directement le code-barres."; }
  P.loading = false; render();
}
function saveProduct(){
  const sh = UI.sheet, P = sh.p;
  ["k","p","g","l"].forEach(f=>P[f] = r1(P[f]));
  P.price = P.price===null||P.price===""||isNaN(P.price) ? null : Math.round(Number(P.price)*100)/100;
  P.weight = P.weight===null||P.weight===""||isNaN(P.weight) ? null : Math.round(Number(P.weight));
  if(!P.name.trim()){ sh.err = "Donne un nom au produit."; return renderSheet(); }
  if([P.k,P.p,P.g,P.l].some(v=>v===null || v<0)){ sh.err = "Renseigne les 4 valeurs pour 100 g, telles qu’écrites sur l’étiquette."; return renderSheet(); }
  if(P.p+P.g+P.l>100.5){ sh.err = "Protéines + glucides + lipides dépassent 100 g : vérifie les valeurs."; return renderSheet(); }
  if((P.price>0) !== (P.weight>0)){ sh.err = "Pour le prix, indique à la fois le prix payé et le poids du paquet (ou aucun des deux)."; return renderSheet(); }
  if(!P.id) P.id = P.code || ("m"+Date.now());
  let moved = "";
  if(P.link) S.pantry.forEach(x=>{ if(x.id!==P.id && x.link===P.link){ x.link=""; moved = x.name; } });
  const i = S.pantry.findIndex(x=>x.id===P.id);
  i>=0 ? S.pantry[i] = P : S.pantry.unshift(P);
  persist(); UI.sheet = null; UI.prod.target = "";
  toast(moved ? `Enregistré. « ${moved} » n’est plus associé.` : sh.existing ? "Produit mis à jour." : "Ajouté au garde-manger.");
  render();
}
function addToList(id, f){
  RECIPES[id].i.forEach(([ing,g])=>{ S.list[ing] = (S.list[ing]||0) + g*f; S.checked = S.checked.filter(x=>x!==ing); });
}
function validate(d){
  if(!(d.age>=14&&d.age<=90)) return "Indique un âge entre 14 et 90 ans.";
  if(!(d.poids>=35&&d.poids<=250)) return "Indique un poids entre 35 et 250 kg.";
  if(!(d.taille>=130&&d.taille<=220)) return "Indique une taille entre 130 et 220 cm.";
  if(d.budget!=="" && d.budget!==null && !(Number(d.budget)>=0)) return "Le budget doit être un montant positif.";
  if(!(d.personnes>=1&&d.personnes<=12)) return "Indique entre 1 et 12 personnes.";
  return "";
}
function closeSheet(){ stopScan(); UI.sheet = null; renderSheet(); }
function go(view){ UI.view = view; UI.err = ""; if(view==="profile") UI.draft = JSON.parse(JSON.stringify(S.profile)); render(); scrollTo(0,0); }
const keepScroll = fn => { const y = scrollY; fn(); scrollTo(0,y); };

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]");
  if(!b){ if(e.target.id==="sheet") closeSheet(); return; }
  const a = b.dataset.a, D = UI.draft;
  switch(a){
    case "set": D[b.dataset.f] = b.dataset.v; keepScroll(render); break;
    case "toggle": { const arr = D[b.dataset.f], v = b.dataset.v, i = arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); keepScroll(render); break; }
    case "vege": D.vege = !D.vege; keepScroll(render); break;
    case "next": { const er = UI.step===0 ? validate({...D, budget:"", personnes:1}) : UI.step===4 ? validate(D) : ""; UI.err = er; if(er) return render(); UI.step++; render(); scrollTo(0,0); break; }
    case "prev": UI.err=""; UI.step--; render(); scrollTo(0,0); break;
    case "finish": S.profile = JSON.parse(JSON.stringify(D)); persist(); go("home"); break;
    case "nav": closeSheet(); go(b.dataset.v); break;
    case "saveProfile": UI.err = validate(D); if(UI.err) return keepScroll(render); S.profile = JSON.parse(JSON.stringify(D));
      S.pantry.forEach(x=>{ x.stores = x.stores.filter(s=>myStores().includes(s)); }); persist(); toast("Profil enregistré."); go("home"); break;
    case "reset": if(confirm("Effacer ton profil, tes favoris, ton garde-manger et ta liste ?")){ S = sane(null); persist(); Photos.clear(); UI.draft = blankProfile(); UI.step = 0; UI.view = "onboard"; render(); } break;
    case "reroll": UI.offsets[b.dataset.t]++; keepScroll(render); break;
    case "filt": UI.filt[b.dataset.k] = b.dataset.k==="type" ? b.dataset.v : Number(b.dataset.v); keepScroll(render); break;
    case "favf": UI.filt.fav = !UI.filt.fav; keepScroll(render); break;
    case "open": UI.sheet = {kind:"recipe", id:Number(b.dataset.id), f:Number(b.dataset.fac)}; renderSheet(); break;
    case "close": closeSheet(); break;
    case "portion": UI.sheet.f = Math.min(3, Math.max(0.25, UI.sheet.f + Number(b.dataset.d))); renderSheet(); break;
    case "fav": { const id = Number(b.dataset.id), i = S.favs.indexOf(id); i<0?S.favs.push(id):S.favs.splice(i,1); persist(); keepScroll(render); toast(i<0?"Ajouté aux favoris.":"Retiré des favoris."); break; }
    case "addone": addToList(Number(b.dataset.id), Number(b.dataset.fac)); persist(); toast("Ingrédients ajoutés aux courses."); break;
    case "addrecipe": addToList(UI.sheet.id, UI.sheet.f); persist(); toast("Ingrédients ajoutés aux courses."); break;
    case "addday": UI.day.forEach(x=>addToList(x.id, x.f)); persist(); toast("Journée ajoutée aux courses."); break;
    case "findprod": { const id = b.dataset.id; closeSheet(); UI.prod.q = searchTerm(id); UI.prod.target = id; UI.prod.results = null; go("products"); doSearch(); break; }
    case "untarget": UI.prod.target = ""; render(); break;
    case "minef": UI.prod.mine = !UI.prod.mine; keepScroll(render); break;
    case "scan": startScan(); break;
    case "newprod": stopScan(); openProduct({id:"",code:b.dataset.code||"",name:"",brand:"",qty:"",img:"",offStores:"",k:null,p:null,g:null,l:null,price:null,weight:null,link:UI.prod.target||"",stores:[]}, false); break;
    case "pickres": { const pr = UI.prod.results[Number(b.dataset.i)]; openProduct(pr, false); enrich(UI.sheet); break; }
    case "editprod": { const pr = S.pantry.find(x=>x.id===b.dataset.id); if(pr) openProduct(pr, true); break; }
    case "pstore": { const arr = UI.sheet.p.stores, v = b.dataset.v, i = arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); renderSheet(); break; }
    case "useprice": { const sh = UI.sheet, x = sh.prices.items[Number(b.dataset.i)];
      sh.p.price = x.price; if(x.weight) sh.p.weight = x.weight;
      if(x.store && !sh.p.stores.includes(x.store)) sh.p.stores.push(x.store);
      renderSheet(); toast(x.weight ? "Prix repris : pense à enregistrer." : "Prix repris : vérifie le poids du paquet."); break; }
    case "saveprod": saveProduct(); break;
    case "delprod": if(confirm("Retirer ce produit ? Les recettes reprendront les valeurs par défaut.")){ S.pantry = S.pantry.filter(x=>x.id!==UI.sheet.p.id); persist(); UI.sheet = null; toast("Produit retiré."); render(); } break;
    case "check": { const id = b.dataset.id, i = S.checked.indexOf(id); i<0?S.checked.push(id):S.checked.splice(i,1); persist(); keepScroll(render); break; }
    case "clearchecked": S.checked.forEach(id=>delete S.list[id]); S.checked = []; persist(); render(); break;
    case "clearlist": if(confirm("Vider toute la liste de courses ?")){ S.list = {}; S.checked = []; persist(); render(); } break;
    case "sharelist": { const t = listText();
      if(navigator.share) navigator.share({title:"Liste de courses", text:t}).catch(()=>{});
      else if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Liste copiée."), ()=>toast("Copie impossible."));
      break; }
    case "export": { const blob = new Blob([JSON.stringify({app:"assiette", version:3, date:new Date().toISOString(), data:S}, null, 2)], {type:"application/json"});
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = `assiette-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000); toast("Sauvegarde exportée."); break; }
    case "import": $("#importfile").click(); break;
    case "savekey": Pics.setKey($("#pkey").value); toast(Pics.key ? "Clé enregistrée." : "Clé supprimée."); keepScroll(render); break;
    case "preload": Pics.blocked = false; Pics.err = ""; Pics.warm = true; RECIPES.forEach(r=>{ const p = Pics.get(r.id); if(p) [p.s,p.m].forEach(u=>fetch(u,{mode:"no-cors"}).catch(()=>{})); else Pics.want(r.id); }); Pics.pump(); toast("Préchargement lancé, garde l’app ouverte."); break;
    case "clearpics": if(confirm("Effacer tes photos locales ? Celles de photos.json restent affichées.")){ Pics.cache = {}; Pics.save(); Pics.blocked = false; Pics.err = ""; toast("Les photos vont se recharger."); keepScroll(render); } break;
    case "exportpics": { const data = Pics.exportJSON(); const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = "photos.json";
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000);
      toast(`photos.json exporté : ${data.count} recettes.`); break; }
    case "nextpic": { const sid = UI.sheet.id; if(!Pics.cache[sid] && Pics.shared[sid]) Pics.cache[sid] = JSON.parse(JSON.stringify(Pics.shared[sid])); const c = Pics.cache[sid]; if(c){ c.i = (c.i+1) % c.list.length; Pics.save(); renderSheet(); refreshPic(sid); } break; }
    case "photo": UI.photoFor = UI.sheet.id; $(b.dataset.src==="cam"?"#photocam":"#photogal").click(); break;
    case "unphoto": if(confirm("Supprimer ta photo ?")){ const id = UI.sheet.id; Photos.del(id).then(()=>{ toast("Photo supprimée."); keepScroll(render); }); } break;
  }
});
document.addEventListener("input", e=>{
  const t = e.target, f = t.dataset.f; if(!f) return;
  const scope = t.dataset.scope;
  if(scope==="filt"){ UI.filt.q = t.value; const list = recipeList(); $("#rlist").innerHTML = listHTML(list); $("#count").textContent = countTxt(list); return; }
  if(scope==="search"){ UI.prod.q = t.value; return; }
  if(scope==="prod"){
    const P = UI.sheet.p; P[f] = t.type==="number" ? (t.value===""?null:Number(t.value.replace(",","."))) : t.value;
    if(f==="price"||f==="weight"){ const el = $("#ppk"), v = P.price>0 && P.weight>0 ? P.price/P.weight*1000 : 0; if(el) el.textContent = v ? `Soit ${eur(v)} le kg, utilisé pour estimer le coût des recettes.` : "Facultatif : sert à calculer le coût réel des recettes."; }
    return;
  }
  if(f==="budget") UI.draft.budget = t.value==="" ? "" : Number(t.value.replace(",","."));
  else UI.draft[f] = t.type==="number" ? Number(t.value.replace(",",".")) : t.value;
  if(f==="budget"||f==="personnes"){ const h = $("#budgethint"); if(h){ const tmp = document.createElement("div"); tmp.innerHTML = fBudget(UI.draft); h.innerHTML = tmp.querySelector("#budgethint").innerHTML; } }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="psearch") doSearch();
  if(e.target.id==="manualcode"){ scan.busy = false; found($("#codeinput").value); }
});
/* Icône d’enseigne introuvable : pastille de secours */
document.addEventListener("error", e=>{ const t = e.target; if(t && t.tagName==="IMG" && t.dataset && t.dataset.store) t.parentNode.innerHTML = badgeHTML(t.dataset.store); }, true);
["#photocam","#photogal"].forEach(sel=>$(sel).addEventListener("change", async e=>{
  const file = e.target.files[0], id = UI.photoFor; e.target.value = "";
  if(!file || id===undefined) return;
  try{ toast("Enregistrement de la photo…"); await Photos.put(id, await resizeImage(file)); toast("Photo enregistrée."); keepScroll(render); }
  catch(err){ toast("Impossible d’enregistrer cette photo."); }
}));
$("#importfile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const j = JSON.parse(rd.result), data = j && j.data ? j.data : j;
      if(!data || !data.profile) throw new Error("format");
      S = sane(data); persist(); UI.draft = JSON.parse(JSON.stringify(S.profile)); toast("Sauvegarde importée."); go("home");
    }catch(err){ toast("Ce fichier n’est pas une sauvegarde Assiette."); }
    e.target.value = "";
  };
  rd.readAsText(file);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && UI.sheet) closeSheet(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && UI.sheet && UI.sheet.kind==="scan") stopScan(); });

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
render();
Pics.loadShared().then(()=>{ if(Pics.sharedCount() && UI.view!=="onboard") keepScroll(render); });
Photos.loadAll().then(()=>{ if(Object.keys(Photos.urls).length && UI.view!=="onboard") keepScroll(render); });
</script>
